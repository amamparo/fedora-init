# fedora-init — one play, run locally as the desktop user.
#
# become is FALSE at play level and opted into per task: half this workload
# (dconf, gsettings, xdg-mime, the session-bus D-Bus modules, user-level
# installers) must run as the login user on the session bus, and a play-level
# become would silently write root's dconf — the classic failure the old
# bash modules guarded against with "no sudo here" comments.
#
# Roles run in the old NN-module order. Tags carry the old module names, so
# `./install.sh battery` still works (install.sh substring-matches bare args
# against role names).
- name: fedora-init
  hosts: localhost
  gather_facts: false
  become: false
  # Handlers (tlp start) replace side effects the bash modules ran
  # unconditionally on every run. A notification lost to a mid-play abort is
  # never re-fired by a converged re-run, so flush handlers even when a task
  # fails — restoring the bash recovery-run behavior.
  force_handlers: true
  vars:
    # The extensions this repo installs — merged additively into
    # /org/gnome/shell/enabled-extensions by roles/common/gnome_extension.yml
    # (vendor-default and user-enabled extensions are preserved).
    gnome_extensions_enabled:
      - rectangle@amamparo
      - no-overview@amamparo
    # USB audio interfaces roles/pipewire pins to WirePlumber's "Pro Audio"
    # profile (every channel a raw port, AUX0..n in device order) — ids as
    # `lsusb` prints them; the name only labels the rendered rule. Add an
    # interface here, never in the template.
    pipewire_pro_audio_devices:
      - name: Neural DSP Quad Cortex mini
        vendor_id: "0x152a" # Thesycon, the UAC2 stack Neural DSP ships
        product_id: "0x892f"
    # Buffer JACK clients (REAPER) ask PipeWire for while they run, as
    # frames/rate. 128 = 2.7 ms, verified xrun-free on the mini; 256 is the
    # next step if a session ever crackles.
    pipewire_jack_latency: 128/48000
    # --- the local LLM stack: roles/ollama -> litellm -> goose/opencode ----
    # Models roles/ollama pulls (ollama.com/library tags; a bare name means
    # :latest). Each is reachable through litellm as ollama/<tag> and is
    # listed in opencode's model picker. Multi-GB one-time downloads:
    # qwen3-coder:30b is 19 GB — a 30B MoE with 3B active parameters, so it
    # generates at small-model speed while reading like a big one, and it
    # tool-calls (the developer extension / opencode's tools need that).
    ollama_models:
      - qwen3-coder:30b
    # Context window every local model loads with (tokens) — ollama's server
    # default AND what opencode budgets against. KV cache scales with it;
    # 32k with the q8_0 cache in the ollama unit is a few GB on the default
    # model. Agents want 64k+ per upstream's docs; raise it if RAM allows.
    llm_local_context: 32768
    # Let ollama use the Intel iGPU through Vulkan (OLLAMA_IGPU_ENABLE).
    # Measured on this machine (roles/ollama has the numbers): ~10x the
    # prompt-processing speed and ~2x the generation speed of the CPU path,
    # coherent output. Costs: inference and the desktop share the GPU (a
    # game and a model visibly fight), and a load that happens while RAM is
    # busy may land only partly on the GPU (`ollama ps` says). false = CPU.
    ollama_igpu: true
    # Anthropic models litellm routes as anthropic/<id> (key from Bitwarden,
    # roles/litellm) and opencode lists. context/output are what opencode
    # budgets against (limit.context) and sends as max_tokens (limit.output);
    # ids and windows per Anthropic's current model table.
    anthropic_models:
      - { id: claude-opus-5, name: Claude Opus 5, context: 1000000, output: 64000 }
      - { id: claude-sonnet-5, name: Claude Sonnet 5, context: 1000000, output: 64000 }
      - { id: claude-haiku-4-5, name: Claude Haiku 4.5, context: 200000, output: 64000 }
    # Clients the litellm role mints a virtual key for (key_alias = the
    # name, stored in ~/.config/litellm/keys/<name>; the goose and opencode
    # roles read theirs from there). Each shows up as its own Virtual Key in
    # the admin UI, with its own spend and logs.
    litellm_clients:
      - goose
      - opencode
    # The litellm route goose and opencode start on (their seeded defaults;
    # after the seed their config files are theirs to change). Local by
    # default: free and offline. anthropic/claude-opus-5 is the other obvious
    # value once the key is seeded.
    llm_default_model: ollama/qwen3-coder:30b
  pre_tasks:
    # The rpm -q guard layer: dnf5 hits the network for metadata even when a
    # transaction is a no-op, so every package task guards on these facts to
    # keep unchanged re-runs offline. check_mode: false so the guards stay
    # truthful under --check. Keys are exact rpm names — virtual provides
    # (tlp-pd provides power-profiles-daemon) can't cause false matches.
    - name: Gather installed-package facts
      ansible.builtin.package_facts:
      check_mode: false
      tags: always
  roles:
    - role: updates
      tags: updates
    - role: snapshots
      tags: snapshots
    - role: hostname
      tags: hostname
    - role: battery
      tags: battery
    - role: window_snapping
      tags: window-snapping
    - role: zsh
      tags: zsh
    - role: cli_tools
      tags: cli-tools
    - role: git_workspace
      tags: git-workspace
    - role: github_cli
      tags: github-cli
    - role: aws
      tags: aws
    - role: multimedia
      tags: multimedia
    - role: steam
      tags: steam
    - role: brave
      tags: brave
    - role: gnome_prefs
      tags: gnome-prefs
    - role: ghostty
      tags: ghostty
    - role: no_overview
      tags: no-overview
    - role: appindicator
      tags: appindicator
    - role: fingerprint
      tags: fingerprint
    - role: login_keyring
      tags: login-keyring
    - role: vscode
      tags: vscode
    - role: claude_code
      tags: claude-code
    - role: claude_desktop
      tags: claude-desktop
    - role: podman
      tags: podman
    - role: tailscale
      tags: tailscale
    - role: mise
      tags: mise
    - role: pipewire
      tags: pipewire
    - role: qpwgraph
      tags: qpwgraph
    - role: reaper
      tags: reaper
    - role: gimp
      tags: gimp
    - role: ollama
      tags: ollama
    - role: litellm
      tags: litellm
    - role: goose
      tags: goose
    - role: opencode
      tags: opencode
