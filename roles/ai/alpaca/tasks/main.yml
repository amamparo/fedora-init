---
# Alpaca — the GNOME desktop client for the ollama daemon the ollama role
# runs: chat, and the model library (browse/pull/delete) as a window instead
# of `ollama pull`/`ollama rm`.
#
# WHY A THIRD-PARTY CLIENT: Ollama ships no Linux app. Its desktop app
# (July 2025) is macOS + Windows only, by construction — every Go file
# under the repo's app/ is fenced off Linux, by a `//go:build windows ||
# darwin` (or single-OS) line or a `_darwin.go`/`_windows.go` filename
# (the sole "unix" one, app/server/server_unix.go, is `//go:build darwin`),
# release CI builds it only in the darwin and windows jobs, the Linux
# tarball manifest matches only bin/ollama + lib/ollama, and app/README.md
# is titled "Ollama for macOS and Windows". Two feature requests
# (ollama/ollama#11609 "Cross
# Platform GUI App", #12898 "ollama ui for linux") have been open since
# 2025 with no maintainer response; later duplicates are closed against
# them. The snap is a community repack of the same CLI tarball. So "the
# ollama app" on Fedora means a client, and this is the pick (2026-09-21):
# GTK4/libadwaita on the GNOME 50 runtime, GPL, built from source on
# Flathub (fourteen releases in 2026, 9.0.0 through 9.2.5), native Ollama
# API with an explicit "Ollama (External)" instance type whose
# list/pull/show/delete all go THROUGH the connected daemon — so a pull
# from Alpaca lands in
# /var/lib/ollama/models exactly like `ollama pull`. Its desktop entry
# carries `Keywords=ai;ollama;llm`, so app search for "ollama" finds it.
# The rest of the Flathub field, for the record: Reins (Flutter, 35 MB,
# Ollama-only, non-GNOME look), Newelle (GNOME-native but defaults to a
# third-party demo API and bundles its own llama.cpp), Jan (Tauri,
# OpenAI-compatible only), Open WebUI's flatpak (an Electron shell that
# pip-installs the server at first launch and self-updates — the
# zero-network rule can't hold), GPT4All (dormant, bundles CUDA). No rpm or
# COPR packages any of them.
#
# A SEPARATE ROLE, not an ollama add-on: the dependency-direction test
# fails the same way it does for claude_desktop and qpwgraph — Alpaca is a
# multi-backend client (Ollama external/managed/cloud plus an OpenAI-
# compatible family) that is meaningful without this repo's daemon.
# Ordered right after ollama (it needs the daemon, not litellm).
#
# COST: ~750 MB download / 2.3 GB installed, plus org.gnome.Platform//50
# (~420 MB) the first time — the Flathub build bundles torch-cpu, whisper,
# kokoro, opencv and rembg for its voice and image features. Inference is
# in the daemon, not the client, so none of that runs unless asked.
#
# The stock flathub remote is configured with a filter file, but the file
# has read `# Unfiltered` since F38 — nothing is hidden, and Alpaca is
# listed (`flatpak remote-ls flathub`). The podman-desktop task shape:
# system scope + become, guarded on the flatpak rpm, the module probes
# `flatpak list --system` first (offline re-run, honest --check), the
# updates role's `flatpak update` keeps it current. One quirk of that
# module to know: its presence check is a SUBSTRING match over the whole
# `flatpak list` output, so `com.jeffser.Alpaca` would read as installed if
# only `com.jeffser.Alpaca.Plugins.Ollama` were present — keep any future
# `state: absent` for the plugin a separate task, never a name prefix.
- name: Install Alpaca (Flathub)
  become: true
  community.general.flatpak:
    name: com.jeffser.Alpaca
    remote: flathub
    state: present
  when: "'flatpak' in ansible_facts.packages"

# DO NOT install com.jeffser.Alpaca.Plugins.Ollama (nor .Plugins.AMD): the
# extensions are end-of-life on Flathub ("no longer maintained"), built for
# runtime 49 while the app is on 50, and replaced in Alpaca 9.0.0 by an
# in-app "Ollama Manager". Nothing pulls them in AND nothing mounts them:
# since the 9.0.0 Flathub manifest the app declares no
# `com.jeffser.Alpaca.Plugins` extension point (live metadata lists only
# Locale and Debug) and no `--env=PATH` with `/app/plugins/bin`, so a stray
# installed plugin is never auto-downloaded nor mounted. 9.2.5 still
# carries a "Deprecated Extension Found" dialog (window.py: `IN_FLATPAK and
# shutil.which('ollama')`), but with the plugin unmounted and the sandbox
# PATH at flatpak's default `/app/bin:/usr/bin` (the host's
# /usr/local/bin/ollama is invisible too) it is unreachable — a plugin left
# over from Alpaca 8 silently wastes 3.5 GB until `flatpak uninstall
# com.jeffser.Alpaca.Plugins.Ollama` by hand. Equally, never use the in-app
# "Ollama (Managed)" instance — it downloads ollama-linux-amd64.tar.zst
# into the sandbox and runs a SECOND daemon on 11435 beside the repo's.
#
# The first launch with zero instances shows an onboarding Guide whose
# "Create Ollama Instance" button is exactly that managed path, so the role
# seeds ONE "Ollama (External)" instance pointing at the system daemon and
# selects it — the guide is skipped (`len(SQL.get_instances()) == 0` is the
# only trigger) and the first launch opens on a chat with the daemon's
# models listed. library/alpaca_instance.py does it (check-mode aware;
# the header explains the SQLite + GSettings-keyfile layout). The gate IS
# Alpaca's guide trigger, and that is the bookmark rule here: any instance
# at all (the user's own, of any type) means nothing is written — edits to
# the seeded row stick (Alpaca updates it in place, id kept) and deleting
# every instance brings the seed back on the next run, exactly when Alpaca
# would otherwise show the Guide; the selection is (re)written with the
# row, since on a zero-row db it can only name a deleted one. The values,
# from Alpaca 9.2.5's src/widgets/instances/ollama_instances.py: `url` is
# the daemon's real bind address (the class default 0.0.0.0 happens to
# reach loopback on Linux too — this names the address rather than lean on
# that, and it is what the instance dialog shows); `api` MUST be non-empty
# — the UI writes the literal NOKEY for a blank field, and with '' the
# header is `Bearer ` with a trailing space, which h11 rejects before any
# request, leaving "No Models Found" (Jeffser/Alpaca#1223; the daemon
# ignores the header — verified 200 with `Bearer NOKEY`);
# `override_parameters: false` so Alpaca sends no options.num_ctx (its
# default is 16384 per request, which would override the unit's
# OLLAMA_CONTEXT_LENGTH and force a model reload every time Alpaca and
# litellm alternate) and the daemon's env stays the single source of truth
# — seeded once, so it must not embed llm_local_context; `keep_alive: 1800`
# rides every CHAT request (seconds; = the unit's OLLAMA_KEEP_ALIVE=30m,
# where Alpaca's default 300 would unload the 18 GB model five minutes
# after a chat). One request it does NOT cover: the chat-TITLE request
# (`generate_chat_title`, a thread on the first message of a new chat,
# same model since `title_model` is None) hard-codes `keep_alive: 0`, and
# ollama's scheduler takes the keep_alive of whichever request landed LAST
# as the runner's idle time — so when the title lands after the reply, that
# first exchange unloads the model as soon as it finishes and the next
# message pays the ~23 s reload; when it lands first, 30 min holds. A
# per-new-chat race, not fixable from the row (a `title_model` would need a
# second, small model pulled). Missing keys fall back to class defaults in
# memory. $HOME write, NO become (root's sandbox dir otherwise). Runs
# before the flatpak's first launch is possible, which is fine: flatpak
# mkdirs ~/.var/app/<id>/{data,config,cache} on launch and takes them as
# they are. Same flatpak-rpm guard as the install: no flatpak, no app to
# seed for.
- name: Seed Alpaca's instance for the system ollama daemon
  alpaca_instance:
    instance_id: fedora-init-ollama
    instance_type: ollama
    properties:
      name: Ollama
      url: http://127.0.0.1:11434
      api: NOKEY
      override_parameters: false
      keep_alive: 1800
  register: alpaca_seed
  when: "'flatpak' in ansible_facts.packages"

- name: Alpaca first-launch notes
  ansible.builtin.debug:
    msg: >-
      Alpaca is a third-party client (Ollama ships no Linux app). Its
      "Ollama" instance points at the system daemon on 127.0.0.1:11434 and
      is pre-selected — models pulled from its model manager land in
      /var/lib/ollama/models like `ollama pull`. Never add an "Ollama
      (Managed)" instance or install com.jeffser.Alpaca.Plugins.Ollama:
      both are a second daemon.
  when: alpaca_seed is changed and not ansible_check_mode
