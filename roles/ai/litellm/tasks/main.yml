---
# LiteLLM proxy — ONE OpenAI-compatible endpoint, 127.0.0.1:4000, in front
# of the local ollama (previous role) and Anthropic's API (key from
# Bitwarden), with its ADMIN UI at http://litellm.localhost/ui. goose
# and opencode (the next two roles) speak only to this: switching a tool
# between a local model and Claude is a model name, not a reconfiguration,
# and any new backend is a route here rather than a per-tool setup.
#
# No rpm exists (checked Fedora and COPR: r0x0d/python-litellm has never
# built), and the container image runs as root and would need host
# networking to reach ollama — so it is a python venv under /opt built with
# the stock `uv` rpm on the system python (3.14 works: verified, wheels
# only, no source builds). The venv is created and populated once, guarded
# on the launcher (the reaper/bw presence class); litellm has no
# self-update, so the updates role — the sanctioned network exception —
# runs `uv pip install -U` there and restarts this service on change.
#
# THE ADMIN UI needs two things (docs/proxy/ui.md: "requires proxy master
# key to be set; requires db connected"), and both live here:
#
#   A MASTER KEY — generated once (sk- + 64 hex) into
#   /etc/litellm/litellm.env, root-only. It signs UI sessions and is the
#   UI password (user `admin`). Clients never carry it: each gets its OWN
#   virtual key of type llm_api (tasks/client_key.yml — /v1/*, /model/info
#   and passthrough only, no /key /user /team routes), minted through the
#   proxy's API once and kept in ~/.config/litellm/keys/<client> for goose
#   and opencode to read. That is what makes the UI's per-key spend and
#   logs mean something, and it keeps a proxy-admin credential out of every
#   client file. With a real key set, the boot check on litellm's main
#   (PR #42019, 2026-09-20 — not yet in any released wheel) that refuses
#   unset/weak keys is satisfied and the old override line is gone.
#   Trust boundary, stated plainly: this is the sudo-global-timestamp class.
#   Prisma's query engine listens on a random loopback port with no auth
#   and raw queries enabled, so ANY local process could talk SQL to the
#   litellm database (and mint itself a key); the per-client keys keep the
#   admin credential out of client files and give the UI per-client spend,
#   they don't fence local processes off — acceptable on this single-user
#   machine, as the keyless design was.
#
#   A DATABASE — Fedora's own postgresql-server rpm, on this host, over the
#   unix socket with PEER auth: systemd names a DynamicUser after its unit,
#   so the service really is user `litellm` (nss-systemd resolves it while
#   the unit runs), Fedora's initdb (`--auth=ident`) already yields `local
#   all all peer`, and a plain LOGIN role owning the `litellm` database
#   applies all 171 migrations (verified; no superuser, no extensions).
#   No password, no pg_hba edit; TCP (localhost:5432 is listening) stays
#   `ident`, which fails every login for lack of an identd — closed in
#   practice. The OS name MUST stay literally `litellm`: peer auth maps it
#   1:1 onto the role, which is why the unit pins `User=litellm` next to
#   DynamicUser=yes (systemd.exec(5): the name comes from User= when set,
#   from the unit's filename otherwise). Fedora's next PostgreSQL MAJOR is
#   the venv's python-major
#   class of trap: postgresql-check-db-dir refuses a PGDATA from an older
#   major, the unit fails, litellm fails with it (Requires=) — either
#   `postgresql-upgrade` + `postgresql-setup --upgrade`, or, since this
#   database is disposable (client keys re-mint themselves on a 401),
#   `rm -rf /var/lib/pgsql/data` and re-run.
#   The DB is meaningless without the proxy, so it lives in this role
#   (the caveman rule), ordered BEFORE the unit so the restart handler
#   never fires against a missing dependency. A container Postgres was
#   rejected with the container proxy: TCP + password, SELinux, rootful or
#   linger, and a third periodic network exception outside updates.
#
#   AND THE PRISMA TOOLCHAIN the DB path drags in. With DATABASE_URL set the
#   proxy runs `prisma --version` and `prisma migrate deploy` at EVERY start
#   through the Prisma CLI (Node!), and connects through prisma-client-py's
#   query engine. Everything it needs is staged read-only under
#   /opt/litellm, mirroring upstream's Dockerfile.database: the `prisma`
#   package pinned to 0.11.0 (what litellm's own lock and image use; 0.15
#   logs an exception on every connect), the CLI + engines pre-fetched into
#   /opt/litellm/prisma-binaries (`prisma py fetch` = npm install of
#   prisma@5.4.2, ~50 MB), the generated client (the shared
#   litellm_prisma_generate include; regenerated only when the schema
#   changes — cmp-gated), Node from Fedora's nodejs22 rpms (exact names:
#   `nodejs` is a virtual provide and would never match the package_facts
#   guard; the alternative is a 447 MB non-LTS nodeenv download under
#   /opt), and the `openssl` CLI rpm — NOT on a stock Workstation, and
#   prisma-client-py shells out to `openssl version` to pick its engine, so
#   without it startup dies with "Not connected to the query engine". At
#   runtime PRISMA_OFFLINE_MODE + PRISMA_CLI_PATH make litellm exec the Node
#   CLI directly (0.3 s per call instead of the 8 s python wrapper, which
#   imports a 77-table pydantic client), verified running with /opt, the
#   cache and HOME all unwritable and no network route.
#
# System service, dedicated DynamicUser, hardened unit (files/litellm.service
# explains each line). Everything under /etc, /opt and /var is become; the
# controller-side pieces — the Bitwarden lookup and the client keys under
# $HOME — run as the user.
#
# STORE_MODEL_IN_DB stays off: with it the UI writes settings into the DB,
# which then wins over config.yaml on every shared key — it would fight the
# converged /etc/litellm/config.yaml. Models are managed in the config.

# --- toolchain rpms -------------------------------------------------------
# cli_tools installs uv as part of the CLI baseline; listed here too so
# `./install.sh litellm` works alone on a fresh machine. One guarded
# transaction (the cli_tools difference-filter pattern): exact rpm names,
# and only the missing ones are named so the converged re-run never
# touches dnf.
- name: Install the litellm toolchain rpms (uv, Node, openssl, PostgreSQL)
  become: true
  ansible.builtin.dnf5:
    name: "{{ litellm_rpms | difference(ansible_facts.packages.keys() | list) }}"
    state: present
    # nodejs22 Recommends nodejs22-docs (52 MB) and nodejs22-full-i18n
    # (33 MB): weak deps the module installs by default and this guard
    # would never see again.
    install_weak_deps: false
  vars:
    litellm_rpms:
      - uv
      - openssl
      - nodejs22
      - nodejs22-libs
      - nodejs22-bin
      - nodejs22-npm
      - nodejs22-npm-bin
      - postgresql-server
      - postgresql
  when: litellm_rpms | difference(ansible_facts.packages.keys() | list) | length > 0

# --- the venv -------------------------------------------------------------
- name: Probe for the litellm launcher (/opt/litellm/bin/litellm)
  ansible.builtin.stat:
    path: /opt/litellm/bin/litellm
  register: litellm_bin
  check_mode: false

# --python /usr/bin/python3 pins the system interpreter: uv would otherwise
# prefer a managed download under /root/.local. The venv symlinks that
# python, so a Fedora major upgrade (new python3.X) orphans it — delete
# /opt/litellm and re-run to rebuild (litellm's requires_python caps at
# <3.15 today; if Fedora's python outruns it, `uv python install 3.14` and
# point --python at that instead).
- name: Create the litellm venv on the system python
  become: true
  ansible.builtin.command:
    argv:
      - uv
      - venv
      - --python
      - /usr/bin/python3
      - /opt/litellm
  args:
    creates: /opt/litellm/bin/python
  environment:
    # Belt-and-braces: --python names the system interpreter, but a typo'd
    # spec would otherwise make uv silently download a managed CPython
    # under /root.
    UV_PYTHON_DOWNLOADS: never

# [proxy] is the extra that brings the server (fastapi/uvicorn/...).
# --compile-bytecode because the service runs as an unprivileged
# DynamicUser with /opt read-only, so python could never write __pycache__
# at runtime and would re-parse the whole package on every start
# (measured: 3.3 s vs 4.8 s to import the proxy).
- name: Install litellm[proxy] into the venv
  become: true
  ansible.builtin.command:
    argv:
      - uv
      - pip
      - install
      - --python
      - /opt/litellm/bin/python
      - --compile-bytecode
      - litellm[proxy]
  args:
    creates: /opt/litellm/bin/litellm

# prisma is NOT a [proxy] dependency (only of extra_proxy); pinned to the
# version litellm's own lock and image use. Guarded on its dist-info (a
# glob, so the python version isn't spelled out).
- name: Install prisma-client-py into the venv
  become: true
  ansible.builtin.command:
    argv:
      - uv
      - pip
      - install
      - --python
      - /opt/litellm/bin/python
      - --compile-bytecode
      - prisma==0.11.0
  args:
    creates: /opt/litellm/lib/python3*/site-packages/prisma-0.11.0.dist-info

# `prisma py fetch` = an npm install of prisma@5.4.2 + @prisma/engines into
# PRISMA_BINARY_CACHE_DIR (the CLI bundle, the schema engine, the query
# engine library), which is where the unit points PRISMA_CLI_PATH. HOME and
# npm_config_cache keep the download caches under /opt/litellm instead of
# /root (the generate include sweeps them; a regenerate never needs them).
# Needs /usr/bin/node + npm (the rpms above). One-time, guarded on
# package-lock.json — npm's LAST write, ~0.6 s after node_modules/.bin/
# prisma appears — so an interrupted fetch can't leave a guard-satisfied
# dir with no schema engine (every later start would fail migrate deploy).
# And an interrupted fetch is swept before retrying: prisma-client-py
# skips its npm install whenever node_modules/prisma/build/index.js
# already exists, so a dir with the CLI but no engines and no lock file
# would otherwise be re-"fetched" forever without ever completing.
# Bumping `prisma==` means wiping this dir and site-packages/prisma first:
# the generated client bakes absolute engine paths and the runtime insists
# on the pinned engine version.
- name: Probe for a completed Prisma CLI fetch
  ansible.builtin.stat:
    path: /opt/litellm/prisma-binaries/package-lock.json
  register: litellm_prisma_lock
  check_mode: false

- name: Sweep an incomplete Prisma CLI fetch
  become: true
  ansible.builtin.file:
    path: /opt/litellm/prisma-binaries
    state: absent
  when: not litellm_prisma_lock.stat.exists

- name: Fetch the Prisma CLI and engines into /opt/litellm/prisma-binaries
  become: true
  ansible.builtin.command:
    argv:
      - /opt/litellm/bin/python
      - -m
      - prisma
      - py
      - fetch
  args:
    creates: /opt/litellm/prisma-binaries/package-lock.json
  environment:
    PATH: /opt/litellm/bin:/usr/bin:/bin
    HOME: /opt/litellm
    npm_config_cache: /opt/litellm/.cache/npm
    PRISMA_BINARY_CACHE_DIR: /opt/litellm/prisma-binaries
    CHECKPOINT_DISABLE: "1"

- name: Generate the Prisma client (only when litellm's schema changed)
  ansible.builtin.include_role:
    name: common
    tasks_from: litellm_prisma_generate

# --- PostgreSQL -----------------------------------------------------------
# postgresql-setup --initdb is Fedora's initdb wrapper (--auth=ident, data
# checksums); the unit refuses to start an un-initdb'd PGDATA, so this
# comes first. creates: on PG_VERSION is the idempotent gate. PGDATA stays
# in the root subvolume on purpose: a snapper rollback then rewinds the
# database together with the venv whose migrations shaped it (12 MB fresh;
# spend logs grow slowly).
- name: Initialise the PostgreSQL cluster
  become: true
  ansible.builtin.command:
    argv:
      - postgresql-setup
      - --initdb
  args:
    creates: /var/lib/pgsql/data/PG_VERSION

# The fresh-`--check` gate: systemd_service hard-fails on a unit whose
# package install was only simulated (the battery gotcha).
- name: Enable and start PostgreSQL
  become: true
  ansible.builtin.systemd_service:
    name: postgresql.service
    enabled: true
    state: started
  when: not ansible_check_mode or 'postgresql-server' in ansible_facts.packages

# Role and database, probe + guarded command, as postgres via runuser (the
# repo's probe-and-create style; community.postgresql is psycopg2-only and
# would add two rpms for two commands). The probes run under --check and
# tolerate a missing server (a fresh dry run), so the creates are gated on
# a probe that actually answered.
- name: Probe for the litellm database role
  become: true
  ansible.builtin.command:
    argv:
      - runuser
      - -u
      - postgres
      - --
      - psql
      - -tAc
      - SELECT 1 FROM pg_roles WHERE rolname = 'litellm'
  register: litellm_pg_role
  changed_when: false
  failed_when: false
  check_mode: false

- name: Create the litellm database role (peer-authenticated, no password)
  become: true
  ansible.builtin.command:
    argv:
      - runuser
      - -u
      - postgres
      - --
      - createuser
      - litellm
  when: litellm_pg_role.rc == 0 and litellm_pg_role.stdout | trim != '1'
  changed_when: true

- name: Probe for the litellm database
  become: true
  ansible.builtin.command:
    argv:
      - runuser
      - -u
      - postgres
      - --
      - psql
      - -tAc
      - SELECT 1 FROM pg_database WHERE datname = 'litellm'
  register: litellm_pg_db
  changed_when: false
  failed_when: false
  check_mode: false

- name: Create the litellm database owned by its role
  become: true
  ansible.builtin.command:
    argv:
      - runuser
      - -u
      - postgres
      - --
      - createdb
      - -O
      - litellm
      - litellm
  when: litellm_pg_db.rc == 0 and litellm_pg_db.stdout | trim != '1'
  changed_when: true

# --- /etc/litellm: unit, config, secrets ----------------------------------
- name: Ensure /etc/litellm exists
  become: true
  ansible.builtin.file:
    path: /etc/litellm
    state: directory
    owner: root
    group: root
    mode: "0755"

# The unit goes in BEFORE the config and the seeds: all three notify the
# restart handler, and with force_handlers a run that aborts between them
# (the Bitwarden fetch fails loudly by design when the item is missing)
# would otherwise fire a restart of a unit systemd has never seen and bury
# the real error under "Could not find the requested service".
- name: Install the litellm unit
  become: true
  ansible.builtin.copy:
    src: litellm.service
    dest: /etc/systemd/system/litellm.service
    owner: root
    group: root
    mode: "0644"
  register: litellm_unit
  notify: Restart litellm

# Repo-declared, converged (the dconf class): the routes are the same on
# every machine and carry no secret — those come from the env file below.
- name: Install the proxy config
  become: true
  ansible.builtin.copy:
    src: config.yaml
    dest: /etc/litellm/config.yaml
    owner: root
    group: root
    mode: "0644"
  notify: Restart litellm

# /etc/litellm/litellm.env holds the secrets, one KEY=value line each,
# 0600 root:root — read by the service manager before the privilege drop,
# so the DynamicUser never opens it. Each line is SEEDED ONLY WHEN ABSENT
# (the bookmark rule), probed per line rather than per file because two
# seeds share the file: the Anthropic key can arrive on a later run than
# the master key. The grep runs as root (0600) and under --check; rc 0 =
# line present. install.sh gates the vault sign-in with the same grep, run
# as `sudo -n grep -qs` once sudo is primed.
# The seeds below only set the mode on the run that CREATES a line; a file
# restored by hand with a looser mode would otherwise stay that way while
# every run reports ok — so the mode is converged unconditionally once the
# file exists.
- name: Probe for the litellm env file
  ansible.builtin.stat:
    path: /etc/litellm/litellm.env
  register: litellm_env_stat
  check_mode: false

- name: Keep the litellm env file root-only
  become: true
  ansible.builtin.file:
    path: /etc/litellm/litellm.env
    state: file
    owner: root
    group: root
    mode: "0600"
  when: litellm_env_stat.stat.exists

# --- the master key and salt key (generated once) -------------------------
# BEFORE the Bitwarden seed on purpose: the vault fetch aborts the play
# loudly when the item is missing, and with force_handlers that abort
# restarts the unit — which must then already have a master key, or the
# proxy comes up keyless (1.102) or refuses to boot (main) until the item
# exists. sk- + 64 hex, litellm's own recipe (`sk-$(openssl rand -hex 32)`), from
# the password lookup so nothing depends on the openssl CLI. The lookup
# yields a fresh value on every evaluation, which is fine: it is only
# evaluated on the one run that writes the line. UI login = user `admin`,
# password = this key; read it back with `just litellm-master-key`. The
# salt key is cheap insurance: anything the UI stores beyond keys and
# spend (MCP servers, credentials, callbacks) is encrypted with
# LITELLM_SALT_KEY, falling back to the master key when unset — and a
# master key that doubles as the encryption key can never be rotated
# without a migration. Never change the salt once set.
- name: Probe for the master key line in the litellm env file
  become: true
  ansible.builtin.command:
    argv:
      - grep
      - -qs
      - ^LITELLM_MASTER_KEY=
      - /etc/litellm/litellm.env
  register: litellm_master_line
  changed_when: false
  failed_when: false
  check_mode: false

- name: Generate the master key into /etc/litellm/litellm.env
  become: true
  ansible.builtin.lineinfile:
    path: /etc/litellm/litellm.env
    regexp: ^LITELLM_MASTER_KEY=
    line: "LITELLM_MASTER_KEY=sk-{{ lookup('password', '/dev/null', chars=['hexdigits'], length=64) | lower }}"
    create: true
    owner: root
    group: root
    mode: "0600"
  no_log: true
  when: litellm_master_line.rc != 0
  notify: Restart litellm

- name: Probe for the salt key line in the litellm env file
  become: true
  ansible.builtin.command:
    argv:
      - grep
      - -qs
      - ^LITELLM_SALT_KEY=
      - /etc/litellm/litellm.env
  register: litellm_salt_line
  changed_when: false
  failed_when: false
  check_mode: false

- name: Generate the salt key into /etc/litellm/litellm.env
  become: true
  ansible.builtin.lineinfile:
    path: /etc/litellm/litellm.env
    regexp: ^LITELLM_SALT_KEY=
    line: "LITELLM_SALT_KEY=sk-{{ lookup('password', '/dev/null', chars=['hexdigits'], length=64) | lower }}"
    create: true
    owner: root
    group: root
    mode: "0600"
  no_log: true
  when: litellm_salt_line.rc != 0
  notify: Restart litellm

- name: Probe for the Anthropic key line in the litellm env file
  become: true
  ansible.builtin.command:
    argv:
      - grep
      - -qs
      - ^ANTHROPIC_API_KEY=
      - /etc/litellm/litellm.env
  register: litellm_anthropic_line
  changed_when: false
  failed_when: false
  check_mode: false

# --- the Anthropic key (Bitwarden, seeded once) --------------------------
# The aws pattern, verbatim in spirit: install.sh signs into the vault only
# while this line is missing, the lookup shells out to bw on the controller
# as the user, and rotation is an edit of the file (or delete the line and
# re-run). Vault item: a login named `anthropic`, password = the API key.
# no_log on the fetch and the write: install.sh always passes --diff and
# the rendered line IS the secret.
- name: Fetch the anthropic item from the Bitwarden vault
  ansible.builtin.set_fact:
    litellm_bw_item: "{{ lookup('community.general.bitwarden', 'anthropic', search='name', result_count=1) | first }}"
  no_log: true
  when:
    - litellm_anthropic_line.rc != 0
    - lookup('env', 'BW_SESSION') | length > 0
    - not ansible_check_mode

- name: Seed the Anthropic key into /etc/litellm/litellm.env
  become: true
  ansible.builtin.lineinfile:
    path: /etc/litellm/litellm.env
    regexp: ^ANTHROPIC_API_KEY=
    line: ANTHROPIC_API_KEY={{ litellm_bw_item.login.password }}
    create: true
    owner: root
    group: root
    mode: "0600"
  no_log: true
  when: litellm_bw_item is defined
  notify: Restart litellm

- name: Note the pending Anthropic key seed
  ansible.builtin.debug:
    msg: >-
      ANTHROPIC_API_KEY is not in /etc/litellm/litellm.env — anthropic/*
      routes answer with an AuthenticationError until it is. Run
      ./install.sh litellm (it signs into Bitwarden and fetches the
      `anthropic` item).
  when:
    - litellm_anthropic_line.rc != 0
    - lookup('env', 'BW_SESSION') | length == 0
    - not ansible_check_mode

# --- port 80: http://litellm.localhost ------------------------------------
# A socket unit on loopback:80 plus systemd's own socket-proxyd forwarding
# to :4000 (files/litellm-http.{socket,service} explain the pieces) — no
# reverse-proxy package, no TLS (browsers treat *.localhost as a secure
# context over plain http). The socket is what gets enabled; the service
# is socket-activated. Both notify the http handler, which daemon-reloads
# and restarts the SOCKET (restarting the socket also stops a running
# forwarder, so the service picks up its own changes on the next connect).
- name: Install the litellm port-80 units
  become: true
  ansible.builtin.copy:
    src: "{{ item }}"
    dest: /etc/systemd/system/{{ item }}
    owner: root
    group: root
    mode: "0644"
  loop:
    - litellm-http.socket
    - litellm-http.service
  register: litellm_http_units
  notify: Restart litellm-http

# --- the service ----------------------------------------------------------
# The restart handlers daemon-reload first; run them now so the enable/start
# below sees the units.
- name: Flush handlers so the new units are loaded before they are started
  ansible.builtin.meta: flush_handlers

# The battery gate in its brave/vscode form: on a fresh --check the UNIT is
# only simulated and systemd_service would hard-fail probing it. Keyed on
# the unit task, not the venv — a venv left by an aborted run with no unit
# file must not crash a dry run.
- name: Enable and start litellm
  become: true
  ansible.builtin.systemd_service:
    name: litellm.service
    enabled: true
    state: started
  register: litellm_start
  when: not (ansible_check_mode and litellm_unit is changed)

# /health/liveliness needs no key and no model; /health would make a real
# request to every route (and can't for wildcards). A DB-backed start is
# slower than the keyless one — the Prisma CLI calls, the migrations on a
# fresh database, then a ~7 s import of the generated client — ~12 s
# measured with the direct CLI; 90 retries is a ceiling, not an estimate.
# Not when a dry run only simulated the unit or the start.
- name: Wait for litellm to answer on 127.0.0.1:4000
  ansible.builtin.uri:
    url: http://127.0.0.1:4000/health/liveliness
  register: litellm_health
  until: litellm_health.status == 200
  retries: 90
  delay: 1
  changed_when: false
  check_mode: false
  when: not (ansible_check_mode and (litellm_unit is changed or litellm_start is changed))

# The socket, not the service (socket-activated). Same fresh-check gate.
- name: Enable and start the litellm port-80 socket
  become: true
  ansible.builtin.systemd_service:
    name: litellm-http.socket
    enabled: true
    state: started
  when: not (ansible_check_mode and litellm_http_units is changed)

# Through the forwarder this time: proves the socket, the activation and
# the Host passthrough in one request.
- name: Wait for litellm to answer on http://litellm.localhost
  ansible.builtin.uri:
    url: http://litellm.localhost/health/liveliness
  register: litellm_http_health
  until: litellm_http_health.status == 200
  retries: 15
  delay: 1
  changed_when: false
  check_mode: false
  when:
    - (litellm_health.status | default(0)) == 200
    - not (ansible_check_mode and litellm_http_units is changed)

# --- client keys ----------------------------------------------------------
# The master key is read back from the root-only env file (become on the
# slurp only) to mint the clients' keys through the API; it never leaves
# this play. Skipped when the proxy isn't answering (a fresh --check).
- name: Read the litellm env file
  become: true
  ansible.builtin.slurp:
    src: /etc/litellm/litellm.env
  register: litellm_env_raw
  no_log: true
  when: (litellm_health.status | default(0)) == 200

# No backreference on purpose: a '\1' inside a Jinja string literal
# decodes to chr(1) (the updates-role lesson) — match the line, strip the
# name.
- name: Extract the master key
  ansible.builtin.set_fact:
    litellm_master_key: >-
      {{ (litellm_env_raw.content | b64decode)
         | regex_search('(?m)^LITELLM_MASTER_KEY=.*$')
         | regex_replace('^LITELLM_MASTER_KEY=', '') | trim }}
  no_log: true
  when: litellm_env_raw.content is defined

- name: Mint a virtual key per client
  ansible.builtin.include_tasks: client_key.yml
  loop: "{{ litellm_clients }}"
  loop_control:
    loop_var: litellm_client
  when: litellm_master_key is defined

- name: Report the admin UI
  ansible.builtin.debug:
    msg: >-
      LiteLLM admin UI: http://litellm.localhost/ui — user `admin`,
      password = the master key (`just litellm-master-key`). Per-client
      virtual keys for {{ litellm_clients | join(', ') }} live in
      ~/.config/litellm/keys/ and show up under Virtual Keys.
  when: litellm_master_line.rc != 0 and not ansible_check_mode
