---
# One virtual key per client (goose, opencode), looped over litellm_clients
# from tasks/main.yml with `litellm_client` set. The key lives in
# ~/.config/litellm/keys/<client> (0600, the user's — goose and opencode
# read it from there), minted once through the proxy's own API with the
# master key and re-minted only when the proxy no longer accepts it (a
# rebuilt database). Every uri here is skipped under --check (no check-mode
# support), so the downstream tasks guard on registered attributes; the
# stat and the verification GET run under --check so a dry run stays
# truthful.

- name: Probe for the client key of {{ litellm_client }}
  ansible.builtin.stat:
    path: "{{ lookup('env', 'HOME') }}/.config/litellm/keys/{{ litellm_client }}"
  register: litellm_client_key_file
  check_mode: false

- name: Read the client key of {{ litellm_client }}
  ansible.builtin.slurp:
    src: "{{ lookup('env', 'HOME') }}/.config/litellm/keys/{{ litellm_client }}"
  register: litellm_client_key_raw
  no_log: true
  when: litellm_client_key_file.stat.exists

# A loopback GET, read-only, deliberately run under --check too: it is how
# a dry run learns that a key on disk no longer opens the proxy. /key/info
# rather than /v1/models on purpose: an llm_api key is REFUSED that route
# with a 403 (which proves the key is known), an unknown key gets a 401 —
# and unlike /v1/models it fans out to nothing (check_provider_endpoint
# makes /v1/models ask Anthropic's /models on every call). Only 401 carries
# the decision; 200 is accepted too, since upstream keeps widening what an
# llm_api key may read and the updates role moves the version every run.
- name: Verify the proxy still knows the client key of {{ litellm_client }}
  ansible.builtin.uri:
    url: http://127.0.0.1:4000/key/info
    headers:
      Authorization: "Bearer {{ litellm_client_key_raw.content | b64decode | trim }}"
    status_code: [200, 403, 401]
  register: litellm_client_key_check
  no_log: true
  changed_when: false
  check_mode: false
  when: litellm_client_key_file.stat.exists

- name: Decide whether a (new) key is needed for {{ litellm_client }}
  ansible.builtin.set_fact:
    litellm_client_key_needed: >-
      {{ not litellm_client_key_file.stat.exists
         or (litellm_client_key_check.status | default(0)) == 401 }}

# The minting uri tasks have no check-mode support and are skipped under
# --check, so a dry run says what a real one would do (the updates role's
# pending-upgrade pattern).
- name: Report a pending key mint under --check for {{ litellm_client }}
  ansible.builtin.debug:
    msg: >-
      A real run would mint a litellm virtual key for {{ litellm_client }}
      ({{ 'the stored one is unknown to the proxy' if litellm_client_key_file.stat.exists
          else 'none stored yet' }}) and update its client config.
  when: ansible_check_mode and litellm_client_key_needed | bool

# key_alias is UNIQUE proxy-wide (a second generate with the same alias is
# a 400), so a stale alias from a previous database life is deleted first;
# a 404/400 here just means there was nothing to delete.
- name: Drop a stale key alias from the proxy for {{ litellm_client }}
  ansible.builtin.uri:
    url: http://127.0.0.1:4000/key/delete
    method: POST
    headers:
      Authorization: "Bearer {{ litellm_master_key }}"
    body_format: json
    body:
      key_aliases: ["{{ litellm_client }}"]
    status_code: [200, 400, 404]
  no_log: true
  changed_when: false
  when: litellm_client_key_needed | bool

# key_type llm_api: /v1/*, /model/info and the passthrough routes only —
# /key, /user, /team management stays with the master key. The raw key
# exists ONLY in this response (the proxy stores a hash), hence the file.
- name: Generate the virtual key for {{ litellm_client }}
  ansible.builtin.uri:
    url: http://127.0.0.1:4000/key/generate
    method: POST
    headers:
      Authorization: "Bearer {{ litellm_master_key }}"
    body_format: json
    body:
      key_alias: "{{ litellm_client }}"
      key_type: llm_api
      metadata:
        managed_by: fedora-init
    status_code: 200
  register: litellm_client_key_new
  no_log: true
  changed_when: true
  when: litellm_client_key_needed | bool

- name: Ensure ~/.config/litellm/keys exists
  ansible.builtin.file:
    path: "{{ lookup('env', 'HOME') }}/.config/litellm/keys"
    state: directory
    mode: "0700"

- name: Store the client key of {{ litellm_client }}
  ansible.builtin.copy:
    dest: "{{ lookup('env', 'HOME') }}/.config/litellm/keys/{{ litellm_client }}"
    content: "{{ litellm_client_key_new.json.key }}\n"
    mode: "0600"
  no_log: true
  when: litellm_client_key_new.json is defined
