---
# ONE handler that reloads systemd itself (daemon_reload: true), for the
# reason spelled out in roles/ai/ollama/handlers: a handler name shared across
# roles resolves to whichever loaded last, and a separate reload handler
# ordered after the restart would restart the stale unit. No reload path
# exists for the proxy (config is read once at startup; --reload is
# uvicorn's dev-only file watcher), so every change is a restart. Gated
# like the start task for a fresh --check.
- name: Restart litellm
  become: true
  ansible.builtin.systemd_service:
    name: litellm.service
    daemon_reload: true
    state: restarted
  when: not (ansible_check_mode and litellm_unit is changed)
