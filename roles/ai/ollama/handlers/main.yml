---
# ONE handler, and it reloads systemd itself (daemon_reload: true runs the
# reload before the restart; the module skips both under --check). Not a
# separate "systemctl daemon-reload" handler like the fingerprint role's:
# ansible resolves a notification by NAME and the LAST loaded handler with
# that name wins, so a second role defining the same name would make this
# role's notification land on a handler that sits after the restart in the
# play's handler list — the restart would then run against the stale unit
# (reproduced with a two-role play). Never share a handler name across
# roles. Gated like the start task: on a fresh --check the unit is
# simulated and systemd_service would hard-fail probing it.
- name: Restart ollama
  become: true
  ansible.builtin.systemd_service:
    name: ollama.service
    daemon_reload: true
    state: restarted
  when: not (ansible_check_mode and ollama_unit is changed)
