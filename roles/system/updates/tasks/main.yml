---
# Bring the system current — everything Fedora's Software app would report:
# rpm updates (dnf), firmware (fwupd/LVFS), and flatpaks when present — plus
# the out-of-dnf installs this repo owns that never update themselves:
# herdr, lazygit, and Neovim's plugins/parsers/language servers.
#
# This role is the repo's DELIBERATE exception to the zero-network
# converged-re-run rule: its concern is drift from upstream, which is
# undetectable offline. It runs first in site.yml so every later role
# resolves against fresh metadata — stale metadata plus mirror lag once
# 404'd a package (podman-tui) mid-play.

# The one safe parallelism in a dnf-dominated play: libdnf5 downloads only
# 3 packages concurrently by default, and every dnf transaction in this
# repo (this upgrade included) inherits the setting. Bumping it makes the
# download phase INSIDE each serial dnf step concurrent without touching
# task order — the transactions themselves can never overlap (one rpm
# lock). 8 is the sweet spot commonly used with Fedora's mirror network;
# past ~10 mirrors throttle and gains vanish. First task in the first role
# so even this play's own upgrade benefits.
- name: Let dnf download 8 packages in parallel (default 3)
  become: true
  community.general.ini_file:
    path: /etc/dnf/dnf.conf
    section: main
    option: max_parallel_downloads
    value: "8"
    no_extra_spaces: true
    mode: "0644"

# update_cache is load-bearing: without it, libdnf5 trusts any cache inside
# its expiry window, and hours-stale metadata can reference rpms already
# pruned from mirrors (the podman-tui 404). This is what actually delivers
# the fresh-metadata promise for the rest of the play.
# noqa: the whole point of this task is latest.
- name: Upgrade all rpm packages # noqa: package-latest
  become: true
  ansible.builtin.dnf5:
    name: "*"
    state: latest
    update_cache: true

# Firmware via fwupd — the LVFS updates the Software app shows. Guarded on
# fwupd being installed (Workstation ships it; minimal installs may not).
# get-updates exit codes, verified on this host: 0 = updates available,
# 2 = nothing to do.
- name: Refresh firmware metadata (LVFS)
  become: true
  ansible.builtin.command:
    cmd: fwupdmgr refresh --force
  changed_when: false
  when: "'fwupd' in ansible_facts.packages"

- name: Check for firmware updates
  become: true
  ansible.builtin.command:
    cmd: fwupdmgr get-updates
  register: updates_firmware
  changed_when: false
  failed_when: updates_firmware.rc not in [0, 2]
  when: "'fwupd' in ansible_facts.packages"

- name: Apply firmware updates
  become: true
  ansible.builtin.command:
    cmd: fwupdmgr update --assume-yes --no-reboot-check
  when: "'fwupd' in ansible_facts.packages and updates_firmware.rc == 0"
  changed_when: true

- name: Report that firmware updates are staged
  ansible.builtin.debug:
    msg: "Firmware updates applied — some only take effect at the next reboot."
  when: "'fwupd' in ansible_facts.packages and updates_firmware.rc == 0"

# Flatpaks (Workstation ships flatpak): keeps the Podman Desktop flatpak the
# podman role installs current, plus anything the user added — Software
# would report those too.
- name: Update flatpaks
  become: true
  ansible.builtin.command:
    cmd: flatpak update --noninteractive
  register: updates_flatpak
  when: "'flatpak' in ansible_facts.packages"
  changed_when: "'Nothing to do' not in updates_flatpak.stdout"

# herdr (roles/ai/herdr): an upstream release binary with no in-place
# self-update from ansible's side (see that role) — presence-guarded like
# fwupd/flatpak above, and read-only under --check the same way.
- name: Probe for the herdr launcher
  ansible.builtin.stat:
    path: "{{ lookup('env', 'HOME') }}/.local/bin/herdr"
  register: updates_herdr_bin
  check_mode: false

- name: Read the installed herdr version
  ansible.builtin.command:
    argv:
      - "{{ lookup('env', 'HOME') }}/.local/bin/herdr"
      - --version
  register: updates_herdr_version
  changed_when: false
  check_mode: false
  when: updates_herdr_bin.stat.exists

- name: Fetch the herdr release manifest
  ansible.builtin.uri:
    url: https://herdr.dev/latest.json
    return_content: true
  register: updates_herdr_manifest
  changed_when: false
  check_mode: false
  when: updates_herdr_bin.stat.exists

- name: Report a pending herdr upgrade under --check
  ansible.builtin.debug:
    msg: >-
      herdr {{ updates_herdr_version.stdout | regex_search('[0-9][0-9.]*') }}
      is installed and {{ (updates_herdr_manifest.content | from_json).version }}
      is the latest release — a real run re-downloads the binary.
  when:
    - ansible_check_mode
    - updates_herdr_bin.stat.exists
    - >-
      (updates_herdr_version.stdout | regex_search('[0-9][0-9.]*'))
      != (updates_herdr_manifest.content | from_json).version

- name: Upgrade herdr to the latest release
  ansible.builtin.include_role:
    name: common
    tasks_from: herdr_install
  vars:
    herdr_manifest: "{{ updates_herdr_manifest.content | from_json }}"
  when:
    - updates_herdr_bin.stat.exists
    - >-
      (updates_herdr_version.stdout | regex_search('[0-9][0-9.]*'))
      != (updates_herdr_manifest.content | from_json).version

# lazygit (roles/dev/lazygit): the official release binary, which never
# updates itself — the herdr shape above. The installed version comes from
# `lazygit --version` ("commit=…, build date=…, version=0.65.1, os=…"), the
# latest from GitHub's /releases/latest redirect (no API rate limit). Both
# probes are read-only and forced under --check so a dry run can report a
# pending upgrade; the upgrade itself is skipped there (tempfile has no
# check-mode support — see the include).
- name: Probe for lazygit
  ansible.builtin.stat:
    path: "{{ lookup('env', 'HOME') }}/.local/bin/lazygit"
  register: updates_lazygit_bin
  check_mode: false

- name: Read the installed lazygit version
  ansible.builtin.command:
    argv:
      - "{{ lookup('env', 'HOME') }}/.local/bin/lazygit"
      - --version
  register: updates_lazygit_version
  changed_when: false
  check_mode: false
  when: updates_lazygit_bin.stat.exists

- name: Resolve the latest lazygit release
  ansible.builtin.uri:
    url: https://github.com/jesseduffield/lazygit/releases/latest
    follow_redirects: none
    status_code: 302
  register: updates_lazygit_latest
  changed_when: false
  check_mode: false
  when: updates_lazygit_bin.stat.exists

- name: Report a pending lazygit upgrade under --check
  ansible.builtin.debug:
    msg: >-
      lazygit {{ updates_lazygit_installed }} is installed and
      {{ updates_lazygit_wanted }} is the latest release — a real run
      re-downloads the binary.
  vars:
    updates_lazygit_installed: "{{ updates_lazygit_version.stdout | regex_search('version=([0-9][0-9.]*)', '\\1') | first }}"
    updates_lazygit_wanted: "{{ updates_lazygit_latest.location | regex_search('/tag/v([0-9][0-9.]*)$', '\\1') | first }}"
  when:
    - ansible_check_mode
    - updates_lazygit_bin.stat.exists
    - updates_lazygit_installed != updates_lazygit_wanted

- name: Upgrade lazygit to the latest release
  ansible.builtin.include_role:
    name: common
    tasks_from: lazygit_install
  vars:
    lazygit_version: "{{ updates_lazygit_latest.location | regex_search('/tag/v([0-9][0-9.]*)$', '\\1') | first }}"
    updates_lazygit_installed: "{{ updates_lazygit_version.stdout | regex_search('version=([0-9][0-9.]*)', '\\1') | first }}"
  when:
    - updates_lazygit_bin.stat.exists
    - updates_lazygit_installed != lazygit_version

# Neovim (roles/dev/neovim): plugins, treesitter parsers and Mason packages
# live outside dnf and never update on their own (the config turns lazy.nvim's
# update checker off — this is its replacement). Presence-guarded on the
# sentinel the neovim role's first clean sync writes, so a machine that never
# ran that role skips. The shared include runs a headless `:Lazy sync` in one
# process, then the parser + Mason upgrade pass in a fresh one (see
# roles/common/files/neovim_sync.lua). Mason upgrades matter beyond
# freshness: kotlin-lsp builds carry a time-limited licence and stop working
# when it expires. `command` has no check-mode support, so --check skips it.
- name: Probe for the Neovim sync sentinel
  ansible.builtin.stat:
    path: "{{ lookup('env', 'HOME') }}/.local/state/nvim/fedora-init-bootstrap"
  register: updates_neovim_sentinel
  check_mode: false

# Never under a live editor: `:Lazy sync` replaces plugin trees beneath
# modules a running nvim has already loaded (the rest would load from the
# new version — a mixed install until restart), and a Mason upgrade
# uninstalls then reinstalls a server that session may be running. So a
# running nvim (this user's, e.g. left open in a herdr pane) skips the update
# with a note instead; the next ./install.sh updates with nvim closed does it.
- name: Check for a running Neovim
  ansible.builtin.command:
    argv:
      - pgrep
      - -x
      - -u
      - "{{ lookup('env', 'USER') }}"
      - nvim
  register: updates_neovim_running
  changed_when: false
  failed_when: false
  check_mode: false
  when: updates_neovim_sentinel.stat.exists

- name: Report the Neovim update skipped for a running nvim
  ansible.builtin.debug:
    msg: >-
      Neovim is running, so its plugins, parsers and language servers were
      NOT updated — close every nvim and re-run ./install.sh updates.
  when:
    - updates_neovim_sentinel.stat.exists
    - updates_neovim_running.rc == 0

- name: Update Neovim plugins, parsers and language servers
  ansible.builtin.include_role:
    name: common
    tasks_from: neovim_sync
  vars:
    neovim_sync_update: true
  when:
    - updates_neovim_sentinel.stat.exists
    - updates_neovim_running.rc != 0
