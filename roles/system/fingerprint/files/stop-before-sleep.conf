# fedora-init — installed to
# /etc/systemd/system/fprintd.service.d/stop-before-sleep.conf
#
# Stop fprintd before the machine sleeps, so the next fingerprint prompt
# activates a fresh daemon that opens the sensor cleanly.
#
# Conflicts= is what performs the stop: starting sleep.target stops every
# unit that conflicts with it. Before= is what makes the stop *finish*
# first — systemd.unit(5) is explicit that Conflicts= carries no ordering
# of its own and recommends pairing it with Before=/After=.
#
# sleep.target is the anchor rather than suspend.target because it is the
# one every mode shares: systemd-suspend.service, systemd-hibernate.service,
# systemd-hybrid-sleep.service and systemd-suspend-then-hibernate.service
# each declare Requires=sleep.target + After=sleep.target, so the target is
# reached before systemd-sleep performs the operation in all four cases.
[Unit]
Conflicts=sleep.target
Before=sleep.target
