---
# hostname — this machine is "thinkpad", and it answers on the LAN as
# "thinkpad.local". Two halves: the static hostname (systemd's hostnamed) and
# the mDNS name avahi publishes from it.
#
# To rename the machine, change the ONE literal below. Deliberately not a var:
# no role in this repo carries a defaults/ or vars/ dir, the value is used
# once, and it's a repo-declared preference of the aws-region / git_config
# class — edit the task, don't override it at runtime.
#
# Where "fedora" comes from today is worth knowing, because it isn't what most
# people assume. NOT DHCP, and NOT /etc/hostname — that file does exist, but
# it holds exactly one byte, a newline, as %ghost %config(noreplace) from the
# systemd rpm, so rpm neither installs nor verifies its content. The name is
# DEFAULT_HOSTNAME="fedora" in /usr/lib/os-release (shipped by
# fedora-release-identity-workstation), which hostnamed falls back to whenever
# the static name is unset — and it says so: `hostnamectl --json=short`
# reports HostnameSource "default" with StaticHostname null. Two consequences:
# the current name is package-provided rather than ours, and EVERY stock
# Fedora Workstation on the LAN is also fedora.local — so this rename lowers
# the mDNS collision odds rather than introducing them.
#
# Setting a static name also ends NetworkManager's claim on the transient one:
# given a valid static hostname NM skips its DHCP/reverse-DNS hostname update
# entirely (its own documented behavior), so no hostname-mode=none is needed.
#
# What this role deliberately does NOT manage, each for a real reason:
#   * /etc/hosts — nss-myhostname already resolves the machine's own name in
#     both directions (proof: "fedora" is in no hosts file today and resolves
#     fine). Worse, `files` precedes `myhostname` in the nsswitch hosts line,
#     so a "127.0.0.1 thinkpad" entry would SHADOW the real LAN address. The
#     "sudo: unable to resolve host" folklore predates nss-myhostname.
#   * /etc/nsswitch.conf and authselect — that hosts line is owned by the
#     nss-mdns rpm's scriptlets (posttrans enables the authselect feature
#     with-mdns4, preuninstall disables it). authselect state also carries
#     with-fingerprint, which this repo's whole passwordless-become design
#     rests on, so never drive authselect from here. Same reason not to swap
#     mdns4_minimal for dual-stack mdns_minimal — which nss-mdns's own README
#     warns times out under IPv6-first applications.
#   * /etc/avahi/avahi-daemon.conf, publish-workstation included — a pristine
#     config(noreplace) file; editing it means owning it and merging .rpmnew
#     forever. That flag controls the legacy _workstation._tcp advert, which
#     avahi-daemon.conf(5) describes as useful "for administrative purposes
#     (i.e. browse for all PCs on the LAN), but ... not required or
#     recommended by any specification" — it is consumed by admin browsers
#     (avahi-browse, avahi-discover), NOT by file managers, whose network view
#     enumerates share types instead. So it is orthogonal to .local resolution
#     (that's the A record), and avahi names the service
#     "<hostname> [<mac address>]" — a MAC broadcast on every network a
#     roaming laptop joins.
#   * firewalld — the default AND active zone is FedoraWorkstation, which
#     already permits 1025-65535/udp, so mDNS on 5353 is open (verified live).
#     Adding the "mdns" service would fork /etc/firewalld/zones into a frozen
#     copy of a vendor file for zero behavior change — the snapshot-of-a-
#     vendor-file trap the claude_desktop .desktop rule forbids.
#   * tailscaled — role ordering does the job (see below); `tailscale set
#     --hostname` would permanently un-stick the tailnet name from the OS
#     hostname.
#   * a reboot — hostnamed sets the running kernel name synchronously, and
#     avahi follows via the handler.
#
# Ordering (site.yml slot 3, right after snapshots): inside the first run's
# btrfs snapshot coverage, and BEFORE the tailscale role — so the first-ever
# `tailscale up` registers "thinkpad" and no admin-console rename is needed.
#
# Substring-matcher note: `./install.sh hostname` (or `name`) reaches only
# this role, but `./install.sh host` also sweeps ghostty (g*host*ty) —
# verified against the matcher, not guessed.

# ansible.builtin.hostname over a guarded `hostnamectl` command task: the
# module IS that guarded task — it probes `hostnamectl --transient status` and
# `--static status` and mutates only on a difference — but it also gets check
# mode right, where a command task would be skipped and report "skipped" when
# "changed" is the truth. Its SystemdStrategy also sets the permanent name
# BEFORE the transient one, which is what keeps NetworkManager quiet (the base
# class does the reverse; only the systemd subclass overrides it). A copy to
# /etc/hostname would be strictly worse: it bypasses hostnamed, so the running
# kernel name stays stale until a reboot — and since avahi publishes whatever
# gethostname() returns, the handler below would then restart the daemon onto
# the OLD name and silently keep answering as fedora.local.
#
# `use: systemd` is not redundant. Autodetection does work (the module runs
# its own platform probe, so gather_facts: false is irrelevant), but there is
# no FedoraHostname class — verified, 35 distro subclasses and not one mention
# of Fedora — so detection rides a single `is_systemd_managed()` canary and
# the fallback is base Hostname, whose strategy_class is UnimplementedStrategy:
# a hard fail, not a degrade. Naming the strategy skips that path entirely.
#
# become: required. SetStaticHostname is the polkit action
# org.freedesktop.hostname1.set-static-hostname (auth_admin_keep), so as the
# user with no polkit agent it fails "Interactive authentication required".
# As root, systemd short-circuits the polkit query for privileged callers — no
# agent, no prompt, no timeout under this repo's passwordless become.
#
# Side effect, accepted deliberately: the module runs `hostnamectl --pretty
# --static set-hostname`, and hostnamectl only drops a redundant pretty name
# when NO flags were passed, so SetPrettyHostname really fires and CREATES
# /etc/machine-info with PRETTY_HOSTNAME=thinkpad. That's what GNOME Settings
# shows as "Device Name" and what Bluetooth advertises as the adapter alias —
# desirable, since leaving those saying "fedora" is exactly the split-brain
# this rename fixes. It is SEEDED, never converged: change detection reads
# only --static, so a later `hostnamectl --pretty set-hostname "Aaron's
# ThinkPad"` is invisible here and survives forever.
#
# Check-mode honesty needs no gate: the module's only actions under --check
# are two read-only status calls, and `hostnamectl --static status` prints an
# empty string with rc=0 when unset (verified live) — a plain string compare
# that is never parsed, so a fresh --check reports "changed" truthfully and
# cannot crash.
- name: Set the static hostname
  become: true
  ansible.builtin.hostname:
    name: thinkpad
    use: systemd
  register: hostname_set
  notify: Restart avahi-daemon

# The rename only reaches the LAN if avahi is actually running, so assert it —
# a converged no-op on Workstation (enabled and active out of the box), the
# tailscaled / podman.socket precedent.
#
# avahi and nss-mdns are assumed, never installed. Workstation ships both, and
# installing nss-mdns would fire its posttrans scriptlet straight into
# authselect (see the header). That makes this the updates role's
# fwupd/flatpak pattern: guard on the package existing.
#
# The guard form differs from tailscale/battery on purpose. Those use
# `not ansible_check_mode or <rpm> in ...` because their own install task was
# only simulated under a fresh --check. This role installs nothing, so an
# absent avahi is GENUINELY absent (a minimal install, never Workstation) —
# and the tailscale form would then evaluate true on a real run and hard-fail
# systemd_service on a unit that is never going to exist. A plain package
# guard covers the minimal-install case and fresh --check in one clause.
# avahi-daemon.socket is left alone: the service Requires= it, and Fedora's
# preset already enables it.
- name: Ensure avahi is running so the name gets published
  become: true
  ansible.builtin.systemd_service:
    name: avahi-daemon.service
    enabled: true
    state: started
  when: "'avahi' in ansible_facts.packages"

# The one diagnostic worth surfacing, because the obvious way to check it
# LIES. systemd-resolved answers this machine's OWN <hostname>.local locally,
# without ever consulting avahi (mDNS is off in resolved on Fedora — avahi
# owns 5353). Verified live, and resolved says so itself: `resolvectl query
# fedora.local` closes with "Data from: synthetic" and returns every local
# address — including ones avahi is not publishing — while a .local name that
# isn't ours fails outright. So `getent ahosts thinkpad.local`
# here would succeed the instant the hostname changes even if avahi were still
# publishing the old name — precisely what would hide a failed restart.
# Fires only on the run that actually renamed, never under --check (the
# github_cli / tailscale nudge pattern).
- name: Note how to verify the new mDNS name
  ansible.builtin.debug:
    msg: >-
      Renamed to {{ hostname_set.name }}. Verify from ANOTHER machine
      (`ping {{ hostname_set.name }}.local`) or with `avahi-resolve -n
      {{ hostname_set.name }}.local` — NOT with `getent`/`resolvectl` here,
      which answer locally whatever avahi publishes. If the name is already
      taken on this LAN, avahi silently publishes {{ hostname_set.name }}-2
      instead; check with `busctl call org.freedesktop.Avahi /
      org.freedesktop.Avahi.Server GetHostName`.
  when: hostname_set is changed and not ansible_check_mode

# ---------------------------------------------------------------------------
# Fallout of the rename, cleaned up here rather than in the brave role: the
# lock below is self-healing until THIS role renames the machine out from
# under it, so by the add-on rule it belongs to the rename's own role.
#
# Chromium — and every Electron app, which embeds it — locks a profile with a
# symlink whose NAME carries the machine and the pid that took it:
#
#   ~/.config/BraveSoftware/Brave-Browser/SingletonLock -> fedora-13834
#
# ProcessSingleton parses that back apart at startup. A stale lock naming THIS
# machine is recovered automatically: it checks the pid, finds it dead, breaks
# the lock and carries on — which is why an unclean browser exit is normally
# invisible. A lock naming a DIFFERENT machine is never broken, on the
# assumption that a profile in a shared/NFS home may genuinely be held by
# another host, where breaking it would corrupt the profile. So the rename
# turns a self-healing lock into a permanent one (diagnosed live 2026-08-16,
# error text verbatim):
#
#   ERROR:chrome/browser/process_singleton_posix.cc:365] The profile appears
#   to be in use by another Brave process (13834) on another computer
#   (fedora). Brave has locked the profile so that it doesn't get corrupted.
#   ERROR:chrome/browser/ui/views/message_box_dialog.cc:200] Unable to show
#   message box: <the same text>
#
# The second line is why this is automated instead of merely documented: the
# dialog explaining the refusal is drawn BY the browser that just refused to
# start, so nothing reaches the screen and clicking the launcher looks like a
# no-op with no error anywhere a user would think to look.
#
# A pristine machine cannot reach this — site.yml runs hostname in slot 3 and
# brave in slot 14, so Brave is not yet installed when the rename happens and
# its first-ever lock already reads thinkpad. The reachable case is the first
# ./install.sh on a machine that has ALREADY been used: the browser ran as
# "fedora", a reboot killed it before it could clean up, and this role then
# renames the host. That is exactly how it happened here.
#
# All four tasks are $HOME work — no become, or we would sweep root's profiles
# and leave the user's alone (the dconf-as-root class).

# Read-only probe, so changed_when: false + check_mode: false — it has to run
# under --check for the conditionals below to mean anything. ~/.config only:
# that is where every Chromium/Electron app this repo installs keeps its
# profile, and this repo installs no flatpaks, so ~/.var/app would be scope
# creep. A missing path is a warning rather than a failure (verified), so a
# machine with no ~/.config walks zero entries instead of hard-failing. depth 3
# reaches the deepest layout in play (BraveSoftware/Brave-Browser/SingletonLock)
# without walking the whole tree.
- name: Find Chromium-family profile locks
  ansible.builtin.find:
    paths: "{{ lookup('env', 'HOME') }}/.config"
    patterns: SingletonLock
    file_type: link
    recurse: true
    depth: 3
  register: singleton_locks
  changed_when: false
  check_mode: false

# find returns stat dicts but NOT the link target, so read it separately.
# follow: false is load-bearing: the target is a relative name that never
# exists as a file (nothing is ever called "fedora-13834"), so following it
# would report the link as missing and lose the name we came for.
- name: Read the machine and pid each lock records
  ansible.builtin.stat:
    path: "{{ item.path }}"
    follow: false
  loop: "{{ singleton_locks.files | default([]) }}"
  loop_control:
    label: "{{ item.path }}"
  register: singleton_targets
  changed_when: false
  check_mode: false

# Compared against hostname_set.name, NOT the live `hostname`: the module
# returns its own `name` parameter unconditionally (verified in its source —
# `kw = dict(changed=changed, name=name, ...)` is built with no check-mode
# branch), so this reads "thinkpad" even on the --check run where the rename
# was only simulated, and the name stays the single literal at the top of this
# file. Split on the LAST hyphen, because hostnames may contain hyphens
# ("old-host-name-4242" -> host "old-host-name", pid 4242); they may contain
# nothing else that regex would treat specially, since RFC 1123 restricts them
# to letters, digits and hyphen, so interpolating the name is safe here.
# selectattr('defined') first: a lock whose target we could not read is left
# strictly alone rather than guessed at.
- name: Select the locks that name a machine this is no longer called
  ansible.builtin.set_fact:
    singleton_foreign: "{{ dict(_paths | zip(_pids)) }}"
  vars:
    _foreign: >-
      {{ singleton_targets.results | default([])
         | selectattr('stat.lnk_target', 'defined')
         | selectattr('stat.lnk_target', 'search', '^.+-[0-9]+$')
         | rejectattr('stat.lnk_target', 'search',
                      '^' ~ hostname_set.name ~ '-[0-9]+$')
         | list }}
    _paths: "{{ _foreign | map(attribute='item.path') | list }}"
    _pids: >-
      {{ _foreign | map(attribute='stat.lnk_target')
         | map('regex_replace', '^.+-([0-9]+)$', '\1') | list }}

# Breaking someone else's lock is only safe with proof that nobody holds it,
# and a dead pid is that proof: no process, no holder. An ALIVE pid is left
# alone even though it is usually benign (a browser running across the rename
# still owns its lock and cleans it up itself on exit). The residual case is
# pid reuse — the old browser is gone and an unrelated process inherited its
# number — which this skips rather than risks, and the debug below says so.
# The asymmetry is deliberate: guessing "stale" wrongly lets a second instance
# into a live profile and corrupts it, while guessing "held" wrongly costs one
# manual rm.
- name: Check whether the process each of those locks names is still running
  ansible.builtin.stat:
    path: "/proc/{{ item.value }}"
  loop: "{{ singleton_foreign | dict2items }}"
  loop_control:
    label: "{{ item.key }} (pid {{ item.value }})"
  register: singleton_pids
  changed_when: false
  check_mode: false

# All three files go, not just the lock: SingletonCookie and SingletonSocket
# carry no hostname of their own, but they belong to the same lock generation
# and the socket's /tmp target is already gone after the reboot that stranded
# the lock. Removing the set is what was verified to restore a wedged Brave.
- name: Break profile locks whose process is gone
  ansible.builtin.file:
    path: "{{ item.0.item.key | dirname }}/{{ item.1 }}"
    state: absent
  loop: >-
    {{ singleton_pids.results | default([])
       | product(['SingletonLock', 'SingletonCookie', 'SingletonSocket'])
       | list }}
  loop_control:
    label: "{{ item.0.item.key | dirname }}/{{ item.1 }}"
  when: not item.0.stat.exists

# Fires only in the rare case above — a foreign-named lock whose pid is alive.
# Benign nine times out of ten, so this explains rather than warns, and hands
# over the one command that fixes the tenth.
- name: Note a profile lock left alone because its pid is still alive
  ansible.builtin.debug:
    msg: >-
      {{ item.item.key }} records pid {{ item.item.value }}, which is still
      running — normal if a browser was open across the rename, since it will
      clean the lock up on exit. If a browser that is definitely NOT running
      still refuses to start, that pid number was reused: quit the app and
      `rm {{ item.item.key | dirname }}/Singleton*`.
  loop: "{{ singleton_pids.results | default([]) }}"
  loop_control:
    label: "{{ item.item.key }}"
  when: item.stat.exists
