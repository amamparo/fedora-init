---
# The proxy reads its code once, so an upgraded venv needs a restart. Its own
# name (not the litellm role's "Restart litellm"): this role runs first, when
# that role's handlers aren't loaded yet, and a shared name across roles is
# ambiguous. Fires only on a real upgrade, so no fresh-check gate is needed.
- name: Restart litellm after upgrade
  become: true
  ansible.builtin.systemd_service:
    name: litellm.service
    state: restarted
