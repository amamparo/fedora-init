---
# opencode (github.com/anomalyco/opencode — sst/opencode until the org
# rename; opencode.ai) — the terminal coding agent, pre-configured to use
# the local litellm proxy as its provider.
#
# OPENCODE 2, not the V1 line. Two lines are live (2026-09-20): V1 (1.18.x,
# GitHub releases, `opencode.ai/install`) and V2 (2.0.x, the `v2` branch,
# distributed as npm packages — `@opencode/cli` + per-platform
# `@opencode/cli-linux-x64` — installed by `opencode.ai/v2/install`). The
# docs redirect to /v2 and the V2 installer REPLACES a V1 binary in place
# (both are `opencode` in ~/.opencode/bin); GitHub's `releases/latest`
# still says 1.18.31 only because the v2.0.x tags carry no release assets.
# So "latest" here is the V2 channel: `opencode.ai/update/api/latest/cli/npm`
# (JSON, `.version`) — what the V2 installer and the binary's own updater
# read — and the artifact is the npm tarball, whose registry metadata
# carries a sha1 (`dist.shasum`) get_url verifies against. ~89 MB tgz,
# one 200 MB glibc-linked ELF at package/bin/opencode (runs on F44:
# verified). No Fedora rpm (the COPRs are one-patch-behind autogenerated
# V1 builds; the vendor's .rpm asset is the separate desktop GUI).
#
# The vendor script is deliberately not run: it never short-circuits when
# already installed (re-downloads on every run), writes an `opencode2`
# compatibility shim, and without --no-modify-path appends an export line
# to ~/.zshrc — a file the zsh role owns. The location IS the vendor's
# (~/.opencode/bin): V2's updater only recognises the curl install method
# when the binary is exactly there, and the zsh role's zshrc puts that dir
# on PATH. Presence is the guard (the claude_code class: never
# version-probe); V2's update policy defaults to notify-only, so the
# updates role's `opencode upgrade` (which runs the V2 script with
# --no-modify-path itself) is what actually upgrades.
#
# Everything is $HOME — NO become (root's opencode otherwise).
#
# Config — two files in ~/.config/opencode, on purpose. V2 loads BOTH
# opencode.json and opencode.jsonc from the global dir, jsonc on top
# (verified in core/src/config.ts loadDirectory and live with `opencode
# debug config`); V1 read config.json/opencode.json/opencode.jsonc the same
# way. That gives a repo-owned layer and a user-owned layer:
#   opencode.json  — CONVERGED, repo-declared (the dconf class): the
#                    litellm provider and its model list, rendered from
#                    site.yml. A custom provider's models MUST be declared
#                    (no /v1/models discovery exists; a provider with zero
#                    models is dropped).
#   opencode.jsonc — SEEDED ONLY WHEN ABSENT (the bookmark rule): the
#                    default `model`/`small_model`. Config `model` beats the
#                    TUI's remembered last choice, so this is the file to
#                    edit to change the default; anything else the user adds
#                    (MCP servers, agents, keybinds) lives here too and
#                    survives re-runs. V2's own writes (`shell`, and the
#                    service token file service.json) go to the LAST
#                    existing candidate — this file — never the managed one.
# Both files are written in the V1 shape (`provider`, `npm`, `options`,
# `small_model`), which V2 migrates in memory to its native
# `providers`/`package`/`settings`/`agents.title.model` (verified live:
# `debug config` shows the migrated form) and which is the only shape the
# published $schema validates — switch to the native shape once V1 is
# gone. `$schema` stays in both files: harmless on V2, and V1 rewrites a
# file without it on load (flip-flop against a converged copy).
# `@ai-sdk/openai-compatible` (chat completions), never `@ai-sdk/openai`
# (Responses API): the known LiteLLM breakage (#25487) is Responses-only.
# With no `options.apiKey` no Authorization header is sent — what the
# keyless proxy wants (verified). V2 adds `store: false` to every request
# and `reasoning_effort: low` to the title request; the litellm config
# drops both for the ollama route (see roles/litellm/files/config.yaml).

- name: Probe for the opencode binary (~/.opencode/bin/opencode)
  ansible.builtin.stat:
    path: "{{ lookup('env', 'HOME') }}/.opencode/bin/opencode"
  register: opencode_bin
  check_mode: false

# The V2 channel's own "latest" endpoint (what the vendor installer and
# the binary's updater read). It answers JSON with a text/plain
# content-type, hence from_json on the body rather than uri's .json. uri
# is skipped under --check, so the block guards on the registered content.
- name: Look up the latest OpenCode 2 version
  ansible.builtin.uri:
    url: https://opencode.ai/update/api/latest/cli/npm
    return_content: true
  register: opencode_latest
  changed_when: false
  when: not opencode_bin.stat.exists

- name: Install OpenCode 2 from its npm platform package
  when: not opencode_bin.stat.exists and opencode_latest.content is defined
  vars:
    opencode_version: "{{ (opencode_latest.content | from_json).version }}"
  block:
    # The registry metadata for the platform package: the tarball URL and
    # its sha1 (`dist.shasum`) — the checksum the vendor script trusts too.
    # Static task name on purpose: the block var is templated for the
    # callback even when the block is skipped, and on a converged run the
    # skipped lookup has no .content — a template error WARNING every run.
    - name: Read the npm registry metadata for the platform package
      ansible.builtin.uri:
        url: https://registry.npmjs.org/@opencode%2fcli-linux-x64/{{ opencode_version }}
        return_content: true
      register: opencode_pkg
      changed_when: false

    # tempfile has no check-mode support; downstream guards on .path (the
    # claude_code pattern).
    - name: Create a temp dir for the opencode tarball
      ansible.builtin.tempfile:
        state: directory
        prefix: opencode-install.
      register: opencode_tmp

    - name: Download the platform tarball (sha1-verified against the registry)
      ansible.builtin.get_url:
        url: "{{ opencode_pkg.json.dist.tarball }}"
        checksum: "sha1:{{ opencode_pkg.json.dist.shasum }}"
        dest: "{{ opencode_tmp.path }}/cli-linux-x64.tgz"
        mode: "0644"
      when: opencode_tmp.path is defined

    # npm tarballs unpack to package/; the binary is package/bin/opencode.
    - name: Unpack the tarball
      ansible.builtin.unarchive:
        src: "{{ opencode_tmp.path }}/cli-linux-x64.tgz"
        dest: "{{ opencode_tmp.path }}"
        remote_src: true
      when: opencode_tmp.path is defined

    - name: Ensure ~/.opencode/bin exists
      ansible.builtin.file:
        path: "{{ lookup('env', 'HOME') }}/.opencode/bin"
        state: directory
        mode: "0755"
      when: opencode_tmp.path is defined

    - name: Install the binary as ~/.opencode/bin/opencode
      ansible.builtin.copy:
        src: "{{ opencode_tmp.path }}/package/bin/opencode"
        dest: "{{ lookup('env', 'HOME') }}/.opencode/bin/opencode"
        remote_src: true
        mode: "0755"
      when: opencode_tmp.path is defined

  always:
    - name: Remove the downloaded tarball and temp dir
      ansible.builtin.file:
        path: "{{ opencode_tmp.path }}"
        state: absent
      when: opencode_tmp.path is defined

# --- provider config ------------------------------------------------------
- name: Ensure ~/.config/opencode exists
  ansible.builtin.file:
    path: "{{ lookup('env', 'HOME') }}/.config/opencode"
    state: directory
    mode: "0755"

# Model ids are litellm's routes verbatim (ollama/<tag>, anthropic/<id>) —
# opencode splits provider/model at the FIRST slash, so nested slashes and
# the ollama tag colon are fine (verified on both lines). limit.context
# drives the context-left gauge and compaction; limit.output was V1's
# max_tokens and is compaction/variant accounting in V2.
- name: Assemble the local models for opencode from site.yml
  ansible.builtin.set_fact:
    opencode_models: >-
      {{ opencode_models | default({})
         | combine({'ollama/' ~ item: {'name': item ~ ' (ollama)',
                                       'limit': {'context': llm_local_context, 'output': 8192}}}) }}
  loop: "{{ ollama_models }}"

- name: Assemble the Anthropic models for opencode from site.yml
  ansible.builtin.set_fact:
    opencode_models: >-
      {{ opencode_models | default({})
         | combine({'anthropic/' ~ item.id: {'name': item.name ~ ' (Anthropic)',
                                             'limit': {'context': item.context, 'output': item.output}}}) }}
  loop: "{{ anthropic_models }}"
  loop_control:
    label: "{{ item.id }}"

# A machine that already had a hand-written ~/.config/opencode/opencode.json
# (the documented global config on both lines) must not lose it to the
# managed render — the zsh role's .pre-fedora-init class. Ours is
# recognisable by `provider.litellm`; anything else (or anything python's
# json can't parse, i.e. a JSONC file) is the user's and becomes the user
# layer: renamed to opencode.jsonc when that is free — V2 loads both with
# jsonc on top and its own writes go to the last existing candidate — or
# copied aside once as opencode.json.pre-fedora-init otherwise.
- name: Probe whether an existing opencode.json is the managed one
  ansible.builtin.command:
    argv:
      - python3
      - -c
      - |
        import json, sys
        try:
            with open(sys.argv[1]) as f:
                data = json.load(f)
        except FileNotFoundError:
            sys.exit(2)
        except Exception:
            sys.exit(1)
        sys.exit(0 if "litellm" in (data.get("provider") or {}) else 1)
      - "{{ lookup('env', 'HOME') }}/.config/opencode/opencode.json"
  register: opencode_managed_probe
  changed_when: false
  failed_when: false
  check_mode: false

- name: Probe for the user's opencode.jsonc and a previous backup
  ansible.builtin.stat:
    path: "{{ item }}"
  loop:
    - "{{ lookup('env', 'HOME') }}/.config/opencode/opencode.jsonc"
    - "{{ lookup('env', 'HOME') }}/.config/opencode/opencode.json.pre-fedora-init"
  register: opencode_layer_probe
  check_mode: false

# rc 0 = ours, rc 1 = the user's (or unparseable), rc 2 = no file.
- name: Move a hand-written opencode.json into the user layer (opencode.jsonc)
  ansible.builtin.command:
    argv:
      - mv
      - "{{ lookup('env', 'HOME') }}/.config/opencode/opencode.json"
      - "{{ lookup('env', 'HOME') }}/.config/opencode/opencode.jsonc"
  when:
    - opencode_managed_probe.rc == 1
    - not opencode_layer_probe.results[0].stat.exists
  changed_when: true

- name: Keep a hand-written opencode.json aside when opencode.jsonc already exists
  ansible.builtin.copy:
    src: "{{ lookup('env', 'HOME') }}/.config/opencode/opencode.json"
    dest: "{{ lookup('env', 'HOME') }}/.config/opencode/opencode.json.pre-fedora-init"
    remote_src: true
    mode: preserve
  when:
    - opencode_managed_probe.rc == 1
    - opencode_layer_probe.results[0].stat.exists
    - not opencode_layer_probe.results[1].stat.exists

# to_nice_json sorts keys, so the render is canonical and this stays
# converged; the app leaves a $schema-carrying file alone.
- name: Install the repo-managed provider config (opencode.json)
  ansible.builtin.copy:
    dest: "{{ lookup('env', 'HOME') }}/.config/opencode/opencode.json"
    content: "{{ opencode_config | to_nice_json }}\n"
    mode: "0644"
  vars:
    opencode_config:
      $schema: https://opencode.ai/config.json
      provider:
        litellm:
          npm: "@ai-sdk/openai-compatible"
          name: LiteLLM (local proxy)
          options:
            baseURL: http://127.0.0.1:4000/v1
          models: "{{ opencode_models | default({}) }}"

# Re-probed here: the move above may just have created it.
- name: Probe for the user's opencode.jsonc
  ansible.builtin.stat:
    path: "{{ lookup('env', 'HOME') }}/.config/opencode/opencode.jsonc"
  register: opencode_user_config
  check_mode: false

# small_model is what titles sessions (V2 migrates it to
# agents.title.model). Unset, opencode looks for a model whose `family` is
# gemini-flash/gpt-nano/claude-haiku within the same provider and, finding
# none (config-declared models have no family), falls back to the main
# model — so the pin changes nothing today; it is here so the title model
# is visible and editable next to the main one.
- name: Seed the default model (opencode.jsonc)
  ansible.builtin.copy:
    dest: "{{ lookup('env', 'HOME') }}/.config/opencode/opencode.jsonc"
    content: "{{ opencode_defaults | to_nice_json }}\n"
    mode: "0644"
  vars:
    opencode_defaults:
      $schema: https://opencode.ai/config.json
      model: "litellm/{{ llm_default_model }}"
      small_model: "litellm/{{ llm_default_model }}"
  when: not opencode_user_config.stat.exists
  register: opencode_seed

- name: Report the opencode setup
  ansible.builtin.debug:
    msg: >-
      opencode is configured for litellm (default litellm/{{ llm_default_model }}).
      Change the default in ~/.config/opencode/opencode.jsonc (yours now) —
      the provider block in opencode.json is managed from site.yml.
      ~/.opencode/bin joins PATH at the next login (zsh role).
  when: opencode_seed is changed and not ansible_check_mode
