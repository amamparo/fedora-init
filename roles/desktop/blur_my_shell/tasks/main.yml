---
# Blur my Shell — a frosted-glass blur behind the top bar and the Activities
# overview, so the wallpaper's colours bleed through both.
#
# There is NO native GNOME setting for this, on 50 or 51 (checked against the
# F45 / GNOME 51 host 2026-10-19): `gsettings list-recursively` has no blur,
# transparency or translucency key for the shell, and the GNOME 51 release
# notes say nothing about the bar or the overview. Mutter 51's "native blur" is
# the `ext-background-effect-v1` Wayland protocol, which lets a CLIENT ask for
# blur behind its own window; Shell's own look is deliberately unchanged. So an
# extension is the only way, and Blur my Shell (UUID blur-my-shell@aunetx) is
# the one that does both surfaces.
#
# Installed from Fedora's rpm rather than extensions.gnome.org, the appindicator
# role's shape: dnf is the update channel (the updates role's `dnf upgrade`
# keeps it current), nothing is fetched per user, and the unit stays rpm-owned
# under /usr/share/gnome-shell/extensions. Deliberately does NOT use the shared
# roles/common/gnome_extension.yml: that rsyncs a bundled source tree and
# compiles schemas, and the rpm already ships the compiled schema.
#
# Versions, and why the install pulls from updates-testing (2026-10-19): F45's
# stable build is v73 (it sits in the `fedora` repo, `updates` has none), which
# can stall login for up to a minute
# (12-56 s reported upstream, issue #1047). PR #1077 traces it to panel.js
# re-queueing its own size update from inside the idle callback while the
# panel's geometry is unavailable, which it is at login; the loop is in the v73
# rpm. v75 removes it (verified by unpacking both rpms: update_size() no longer
# calls queue_update_size()), its rpm needs only gnome-shell >= 46, declares
# shell 46-51 and keeps the same schema keys. Bodhi FEDORA-2026-3e9986aa3b has
# 75-1.fc45 in updates-testing with stable already requested; the pre-release
# freeze holds it back from `updates` until after GA. So this role takes the
# package from updates-testing — THIS ONE PACKAGE: `enablerepo` enables the repo
# for the single transaction and persists nothing.
#
# REMOVE WHEN a stable repo (`fedora` or `updates`) lists 75 or newer: drop
# `enablerepo` and `update_cache`; keep the `>= 75` floor (it costs nothing and
# keeps v73 out for good) and keep the `when:` gate, which is what keeps a
# converged re-run offline; the updates role's `dnf upgrade` then keeps the
# package current. That cleanup is required, not optional: while `enablerepo`
# stays, a fresh machine installs whatever is newest in updates-testing (v76 or
# later), not the stable build. It is ENFORCED, not remembered: the three
# tripwire tasks directly below fail the play with these instructions the first
# time a stable repo lists a build that new, and are themselves deleted as part
# of the cleanup.
#
# v73 is NEVER installed by this role (the user's hard rule). The package spec
# is `>= 75`, not the bare name with `state: latest`, because a bare name
# resolves to the newest build in whatever repos are enabled: if the testing
# build were ever retracted or the mirror lost, that would silently settle on
# v73 from `fedora`/`updates`. With the `>= 75` floor dnf has no candidate and
# fails instead ("No match for argument ... >= 75", verified by a dry run
# without updates-testing). The gate below also makes the task fire when v73 is
# already installed (older than 75), so the spec upgrades it rather than
# leaving it. Don't set skip_broken here: it would turn that failure back into
# a silent skip.
#
# The task is gated on the installed version (absent, or older than 75) so a
# converged re-run never reaches dnf and stays offline. Failure mode:
# updates-testing has skip_if_unavailable=false (like `updates`), so on a run
# that reaches the task an unreachable testing mirror fails it and aborts the
# play at this role; it does NOT fall back to v73. install_weak_deps is off
# because the rpm Recommends gnome-extensions-app, which duplicates Extension
# Manager (the extension_manager role installs that). update_cache because
# stale metadata is a known trap in this repo (see the updates role); it costs
# anything only on the run that installs.
#
# The tripwire. It asks dnf's own cache what a STABLE repo (updates-testing
# excluded) offers, offline: `-C` is cache-only, and the updates role, which
# runs first in the same play, has just refreshed that cache, so a converged
# re-run stays zero-network. Checked 2026-10-19: with testing excluded it
# prints only `73`, and v73 comes from `fedora`, so the probe has to look at
# every stable repo, not just `updates`. `./install.sh blur` alone checks the
# cache as the last full run left it. Read-only, so it also runs under --check
# (and a dry run fails the same way, which is honest: the cleanup is pending).
- name: Look for a stable Blur my Shell build in dnf's cache
  ansible.builtin.command:
    cmd: >-
      dnf5 -C repoquery --disablerepo=updates-testing --latest-limit=1
      --qf '%{version}\n' gnome-shell-extension-blur-my-shell
  register: blur_my_shell_stable_probe
  changed_when: false
  failed_when: false
  check_mode: false

# A probe that cannot answer (no cache for a repo, dnf5 changed its CLI) is
# reported, never silently read as "no stable build yet": that would disarm the
# tripwire without anyone noticing.
- name: Warn that the stable-build check could not run
  ansible.builtin.debug:
    msg: >-
      Could not check whether a stable Fedora repo now carries Blur my Shell
      {{ blur_my_shell_min_version }} or newer (`dnf5 -C repoquery` exited
      {{ blur_my_shell_stable_probe.rc }}: {{ blur_my_shell_stable_probe.stderr }}).
      The updates-testing workaround below stays in place; run
      `dnf5 repoquery --refresh gnome-shell-extension-blur-my-shell` by hand.
  when: blur_my_shell_stable_probe.rc != 0

- name: Fail once a stable repo carries Blur my Shell >= the minimum version
  ansible.builtin.fail:
    msg: |-
      Blur my Shell {{ blur_my_shell_stable_version }} is now in a stable Fedora repo (this role's
      minimum is {{ blur_my_shell_min_version }}), so its updates-testing workaround is obsolete and has to
      come out. This failure is deliberate and repeats on every run until the role is changed.

      WHY: the install task enables updates-testing for its dnf transaction. Left alone, a fresh
      machine would install whatever is newest in testing (v76 or later, unreviewed), not the
      stable build.

      FIX, in roles/desktop/blur_my_shell/tasks/main.yml:
        1. In the "Install Blur my Shell" task, delete `enablerepo: updates-testing` and
           `update_cache: true`. KEEP the `>= {{ blur_my_shell_min_version }}` floor and the `when:` gate (the gate
           is what keeps a converged re-run offline). Rename the task to drop "from updates-testing".
        2. Delete the three tripwire tasks, from "Look for a stable Blur my Shell build in dnf's
           cache" through this one, the "REMOVE WHEN" comment, and the README/AGENTS.md sentences
           that describe the updates-testing install.
        3. Leave the stylesheet shim ("Install the stylesheets the Blur my Shell rpm omits") alone:
           it has its own removal condition, `rpm -ql gnome-shell-extension-blur-my-shell`
           listing styles/.
        4. Run `just check`, then `./install.sh blur`.

      Check by hand:
        dnf5 -C repoquery --disablerepo=updates-testing gnome-shell-extension-blur-my-shell
  vars:
    blur_my_shell_stable_version: >-
      {{ blur_my_shell_stable_probe.stdout_lines | select('match', '^[0-9][0-9.]*$')
         | list | last | default('0') }}
  when:
    - blur_my_shell_stable_probe.rc == 0
    - blur_my_shell_stable_version is version(blur_my_shell_min_version, '>=')

# Wayland can't hot-reload GNOME Shell — a newly installed system extension
# takes effect at the next login.
- name: Install Blur my Shell (v75+ from updates-testing)
  become: true
  ansible.builtin.dnf5:
    name: gnome-shell-extension-blur-my-shell >= {{ blur_my_shell_min_version }}
    state: present
    enablerepo: updates-testing
    update_cache: true
    install_weak_deps: false
  when: >-
    'gnome-shell-extension-blur-my-shell' not in ansible_facts.packages
    or ansible_facts.packages['gnome-shell-extension-blur-my-shell'][0].version
    is version(blur_my_shell_min_version, '<')

# The rpm omits the extension's stylesheets, and without them the top bar stays
# solid black (diagnosed live 2026-10-19 on 75-1.fc45, extension ACTIVE, both
# blur switches true, no error in the journal). Upstream split its CSS into
# src/styles/ after Fedora's meson patch (0001-Use-meson-build-system.patch,
# upstream PR 626) was written: the shipped stylesheet.css is only ten
# `@import url("styles/….css")` lines, the patch's src/meson.build installs
# extension.js, prefs.js, stylesheet.css and five source dirs but NOT styles/,
# and `rpm -ql` lists no styles/ file. So `#panel.transparent-panel`
# (`background: transparent !important`, in styles/panel.css) exists nowhere,
# the panel keeps GNOME's opaque stock background, and that background sits
# on top of the blur actor the extension inserts BEHIND it in the panel box:
# the blur renders and is never seen. Verified by unpacking the srpm, not by
# observing the bar. The v75 "verified by unpacking" check above covered
# panel.js and the schema and missed this: read the rpm's file list, not only
# its code.
#
# The fix is to put the missing directory next to the rpm's stylesheet.css
# (an @import resolves relative to the importing file, so it has to live
# inside the extension dir; a user-local copy of the whole extension would
# shadow the rpm wholesale and stop dnf updating it). files/styles/ is
# upstream's v75 src/styles/ byte-for-byte (GPL-3.0-or-later, see
# files/NOTICE.txt) — VENDORED, not fetched, so a fresh install needs no
# extra network and a converged re-run needs none at all. It is written under
# /usr/share, so become, as `copy` (per-file checksums keep it converged;
# `synchronize` would add rsync flags for nothing) with `diff: false` — the
# first run would otherwise print ~90 KB of CSS because install.sh always
# passes --diff.
#
# Gated on CONTENT, never on a version number, so one guard covers every case:
# a self-contained stylesheet.css (no @import, e.g. an older single-file
# build) needs nothing; and once Fedora fixes the packaging, rpm owns
# styles/panel.css, the task turns itself off, and rpm overwrites our unowned
# copies on the upgrade that introduces them. The probes are read-only
# (changed_when/check_mode off) and run after the install above, so a fresh
# machine gets the styles in the same run as the package; both tolerate an
# absent rpm (fresh --check, where the install was only simulated). Facts are
# not used for the install gate: they predate this run's dnf transaction.
#
# REMOVE WHEN `rpm -ql gnome-shell-extension-blur-my-shell` lists styles/ (not
# when v75 reaches `updates` — that build and v73 have the same hole): delete the five
# tasks below this comment and files/styles/. The install task above reaching
# stable `updates` does NOT fix this.
- name: Read the installed Blur my Shell stylesheet
  ansible.builtin.slurp:
    src: /usr/share/gnome-shell/extensions/blur-my-shell@aunetx/stylesheet.css
  register: blur_my_shell_stylesheet
  failed_when: false

- name: Check whether the rpm owns the extension's styles/panel.css # noqa: command-instead-of-module
  ansible.builtin.command:
    cmd: >-
      rpm -qf --qf '%{NAME}\n'
      /usr/share/gnome-shell/extensions/blur-my-shell@aunetx/styles/panel.css
  register: blur_my_shell_styles_owner
  changed_when: false
  failed_when: false
  check_mode: false

- name: Install the stylesheets the Blur my Shell rpm omits
  become: true
  ansible.builtin.copy:
    src: styles/
    dest: /usr/share/gnome-shell/extensions/blur-my-shell@aunetx/styles/
    owner: root
    group: root
    mode: "0644"
    directory_mode: "0755"
  diff: false
  register: blur_my_shell_styles
  when:
    - blur_my_shell_stylesheet.content is defined
    - '"styles/" in (blur_my_shell_stylesheet.content | b64decode)'
    - blur_my_shell_styles_owner.rc | default(0) != 0

# A newer rpm that still omits styles/ would run against stale CSS (a later
# release can add an import file or change a rule). Facts predate the install
# above, so on the run that first pulls a newer build this stays quiet and the
# next run says it; the warning is advisory, never fatal.
- name: Warn when the vendored Blur my Shell styles may be stale
  ansible.builtin.debug:
    msg: >-
      files/styles/ in the blur_my_shell role is upstream v75's, but the
      installed rpm is
      {{ ansible_facts.packages['gnome-shell-extension-blur-my-shell'][0].version }}.
      Refresh it from that release's src/styles/ (byte-for-byte, as before),
      or drop the shim if the rpm now ships styles/.
  when:
    - blur_my_shell_styles is not skipped
    - "'gnome-shell-extension-blur-my-shell' in ansible_facts.packages"
    - ansible_facts.packages['gnome-shell-extension-blur-my-shell'][0].version
      is version('75', '!=')

# The stylesheet is read when the extension is enabled, not at every frame, so
# a bar that was black when the files landed stays black until it is reloaded.
# Wayland can't restart the shell, so: log out and back in (always works), or,
# if Blur my Shell was already loaded in the running session, toggle it.
- name: Say how to pick up the new Blur my Shell stylesheets
  ansible.builtin.debug:
    msg: >-
      Blur my Shell's stylesheets were just installed, so the top bar stays
      solid black until the extension reloads them. Log out and back in; or,
      if Blur my Shell was already running in this session, run
      `gnome-extensions disable blur-my-shell@aunetx &&
      gnome-extensions enable blur-my-shell@aunetx`.
  when: blur_my_shell_styles is changed and not ansible_check_mode

# Enablement is ADDITIVE (same rule as gnome_extension.yml and appindicator):
# read the EFFECTIVE enabled list via gsettings — NOT `dconf read`; vendor
# defaults like background-logo live in gschema overrides, invisible in the
# user db until first written — union the UUID in, write back. A bare set would
# drop Fedora's defaults and the repo's own extensions. User dconf, session
# bus — NEVER become.
- name: Read the effective enabled-extensions list
  ansible.builtin.command:
    cmd: gsettings get org.gnome.shell enabled-extensions
  register: blur_my_shell_enabled_probe
  changed_when: false
  check_mode: false

- name: Enable the Blur my Shell extension
  community.general.dconf:
    key: /org/gnome/shell/enabled-extensions
    value: >-
      {{ (blur_my_shell_enabled_probe.stdout | regex_findall("'([^']+)'")
          + ['blur-my-shell@aunetx']) | unique | list | string }}
    state: present

# The two switches that ARE the requested look. Both already default to true
# (schema org.gnome.shell.extensions.blur-my-shell, verified in the rpm), so
# these state intent and keep the look if upstream ever flips a default. Each
# key is a literal `key:` line on purpose: dotfiles_common.declared_dconf_keys
# finds repo-owned keys with a per-line regex, so a looped `key: "{{ item }}"`
# would be invisible to it and `just save` could then capture the same key.
#
# NOTHING ELSE is managed — sigma, brightness, colour, noise, the `pipelines`
# dict and the panel/overview style enums. Those are taste, tuned live in
# Extension Manager or the extension's own preferences, and a converged value
# here would revert the tuning on every run (from v73 on, blur radius and
# brightness live in `pipelines`, a dict no scalar key could pin anyway).
# GVariant text: a bare `true`.
- name: Blur the top bar
  community.general.dconf:
    key: /org/gnome/shell/extensions/blur-my-shell/panel/blur
    value: "true"
    state: present

- name: Blur the Activities overview
  community.general.dconf:
    key: /org/gnome/shell/extensions/blur-my-shell/overview/blur
    value: "true"
    state: present
