# Brave: the only browser on this machine, from Brave's official rpm repo.
# The repo file ships gpgcheck=1 with the signing-key URL, so dnf imports and
# verifies the key on install — no separate rpm_key step needed. Order is
# load-bearing: repo file, install, set the default, and only THEN remove the
# other browsers, so the http/https handlers never dangle.

- name: Install Brave rpm repo file
  become: true
  ansible.builtin.copy:
    src: brave-browser.repo
    dest: /etc/yum.repos.d/brave-browser.repo
    owner: root
    group: root
    mode: "0644"
  register: brave_repo

# Guarded on package_facts (see site.yml): dnf5 refreshes repo metadata even
# for a no-op transaction, and a converged re-run must do zero network work.
# The check-mode clause: under --check the repo file above is not actually
# written, and dnf5 resolves (and NOT_FOUND-fails) even in check mode — skip
# the install when check mode would have just created the repo; the copy
# task already reports that pending change.
- name: Install Brave
  become: true
  ansible.builtin.dnf5:
    name: brave-browser
    state: present
  when:
    - "'brave-browser' not in ansible_facts.packages"
    - not (ansible_check_mode and brave_repo is changed)

# Brave is missing from alt+tab for the first 15 seconds after its window is
# already on screen. Mechanism, verified end to end against upstream source:
#
#   1. The vendor entry sets StartupNotify=true, so gnome-shell opens a startup
#      sequence and hands the launch DESKTOP_STARTUP_ID + XDG_ACTIVATION_TOKEN
#      (confirmed on this machine by reading the launched wrapper's environ).
#   2. Brave never activates with that token, so mutter holds the sequence open
#      until STARTUP_TIMEOUT_MS force-completes it — 15000 ms exactly,
#      mutter/src/core/startup-notification.c.
#   3. For that whole window gnome-shell pins the app in
#      SHELL_APP_STATE_STARTING: shell_app_sync_running_state() promotes to
#      RUNNING only `if (app->state != SHELL_APP_STATE_STARTING)`.
#   4. alt+tab is built from shell_app_system_get_running(), whose running_apps
#      table only ever receives RUNNING apps — STARTING ones are excluded.
#
# So the window is up and usable while the app is not in the switcher, for
# exactly the 15s timeout.
#
# StartupNotify is the only lever XDG offers, and it lives in the desktop entry.
# Shadowing the entry into ~/.local/share/applications was tried and REJECTED on
# two counts. A local entry wins wholesale, freezing Exec/StartupWMClass/MimeType
# as a stale vendor snapshot — the general rule the icon override below obeys.
# Worse, it hands Brave a file it rewrites at runtime: with a user copy present,
# Brave's default-browser flow appended a mailto MimeType line to it, and put it
# at EOF — inside the trailing [Desktop Action] group instead of [Desktop Entry],
# i.e. a corrupted entry. Managing that converged would fight the app forever
# (the reaper.ini / claude_desktop_config.json rewrite-at-runtime class), and
# seeding it once instead would just re-freeze the vendor snapshot.
#
# So patch the ONE key in the vendor entry. Surgical and idempotent, nothing
# frozen, the xdg_mime task below untouched, and root-owned so Brave cannot
# mangle it. insertafter is load-bearing rather than decorative: with regexp
# alone, a future vendor entry that drops the key would get StartupNotify
# appended at EOF, landing it in the last [Desktop Action] group — reproducing
# the exact corruption described above.
#
# rpm owns this file, so `dnf upgrade brave-browser` restores StartupNotify=true
# and the delay comes back. Inside a normal run that self-heals (updates goes
# first, this role follows), but a bare `dnf upgrade` leaves it until the next
# ./install.sh — and `rpm -V brave-browser` will report the file as modified.
#
# Trade: Brave loses its launch feedback (busy cursor / dash pulse) for the 1-2s
# before its window maps. That beats 15s of a missing switcher entry.
- name: Probe the vendor Brave desktop entry
  ansible.builtin.stat:
    path: /usr/share/applications/brave-browser.desktop
  register: brave_vendor_desktop
  changed_when: false
  check_mode: false

# Gated on the stat rather than just attempted: on a fresh --check the install
# above was only simulated, so the entry does not exist yet and lineinfile would
# hard-fail the dry run.
- name: Disable Brave's startup notification
  become: true
  ansible.builtin.lineinfile:
    path: /usr/share/applications/brave-browser.desktop
    regexp: '^StartupNotify='
    line: StartupNotify=false
    insertafter: '^\[Desktop Entry\]$'
    owner: root
    group: root
    mode: "0644"
  when: brave_vendor_desktop.stat.exists

# Default browser for the desktop user — no become here. The old module's
# xdg-settings under sudo would have written root's ~/.config/mimeapps.list
# instead of the user's; xdg_mime is the same trap. This is the declarative
# equivalent of `xdg-settings set default-web-browser brave-browser.desktop`
# on GNOME, which claims exactly these five MIME types (about/unknown
# included — xdg-settings' set_browser_gnome3 sets them too). (xdg_mime
# needs community.general >= 10.7.0; it queries before writing, so a
# converged re-run reports ok.)
- name: Make Brave the default browser for the desktop user
  community.general.xdg_mime:
    handler: brave-browser.desktop
    mime_types:
      - x-scheme-handler/http
      - x-scheme-handler/https
      - x-scheme-handler/about
      - x-scheme-handler/unknown
      - text/html

# Since the Anaconda WebUI installer (F42+ Workstation), fresh installs
# leave the installer's web UI on disk, and anaconda-webui declares the
# boolean dep `(firefox if fedora-release-workstation)` — it renders its UI
# in Firefox. With it installed, the firefox removal below is a depsolve
# error (the solver refuses the rich dep rather than cascading the
# dependent), so drop the installer UI first — dead weight on an installed
# system anyway; autoremove sweeps its now-orphaned dep chain. Exact-name
# guard, same offline-re-run rule as the browser removals. F44 adds
# anaconda-live, which hard-requires anaconda-webui — the solver won't
# cascade that dependent either, so it goes first in the loop.
- name: Remove the leftover Anaconda installer UI (it pins Firefox)
  become: true
  ansible.builtin.dnf5:
    name: "{{ item }}"
    state: absent
    autoremove: true
  loop:
    - anaconda-live
    - anaconda-webui
  when: item in ansible_facts.packages

# Remove the other browsers (Fedora ships Firefox), after the default points
# at Brave. Guard each with package_facts: the dnf5 CLI errors out (rather
# than no-ops) when asked to remove a package that isn't installed — and the
# guard also keeps converged re-runs offline. autoremove: the module,
# unlike the CLI, does NOT sweep now-unused dependencies by default
# (clean_requirements_on_remove is wired to this flag), and the bash flow
# relied on that sweep.
- name: Remove other browsers
  become: true
  ansible.builtin.dnf5:
    name: "{{ item }}"
    state: absent
    autoremove: true
  loop:
    - firefox
    - chromium
    - epiphany
    - google-chrome-stable
  when: item in ansible_facts.packages

# Custom app icon — a Netscape-styled Brave lion in place of the vendor mark.
#
# This overrides the ICON THEME, never the .desktop entry. Shadowing
# brave-browser.desktop in ~/.local/share/applications just to change `Icon=`
# is the trap claude_desktop already paid for: entries REPLACE rather than
# merge across XDG dirs, so the local copy would win wholesale and freeze
# Exec/StartupWMClass/MimeType as a stale snapshot of something Brave owns and
# changes — and the xdg_mime task above depends on that entry's MimeType list.
# (The StartupNotify fix above patches the vendor entry in place for exactly
# this reason: no local copy, so nothing is frozen and nothing shadows.)
#
# Overriding /usr/share/icons/hicolor would be worse than useless: those files
# are NOT rpm-owned (`rpm -ql brave-browser` doesn't list them). Brave's
# postinstall scriptlet GENERATES them, running `xdg-icon-resource install`
# over its bundled /opt/brave.com/brave/product_logo_<size>.png set — so every
# `dnf upgrade`, i.e. every updates-role run, would silently restore the vendor
# icon. ~/.local/share/icons is untouched by that scriptlet and outranks
# /usr/share per the XDG icon spec, so this override survives Brave updates.
#
# Seven sizes, exactly the set that scriptlet registers (16 24 32 48 64 128
# 256). The spec's lookup loops the size subdir OUTSIDE the basedir list, so
# any size we DON'T ship resolves to the vendor icon at that size — a partial
# set gives a mixed icon depending on where GNOME draws it. Pre-scaled at
# authoring time from the 465x465 master kept beside the tree (Lanczos), the
# reaper pre-merged-icon-pack precedent: no ImageMagick on the target, and
# better 16px quality than GTK downsampling a 465px image on the fly.
#
# src has a trailing slash so the tree's CONTENTS merge into the user's
# hicolor theme; copy is checksum-idempotent, and the master PNG sits outside
# hicolor/ so it is never installed. $HOME write, so NO become — root's icon
# theme otherwise, the dconf-as-root class.
- name: Install the Netscape-styled Brave app icon
  ansible.builtin.copy:
    src: icons/hicolor/
    dest: "{{ lookup('env', 'HOME') }}/.local/share/icons/hicolor/"
    mode: "0644"
  notify: Refresh the user icon cache
