---
# Goose — the DESKTOP app (github.com/aaif-goose/goose, Block's coding
# agent, now under the Agentic AI Foundation), pre-configured to use the
# local litellm proxy. It replaced Fedora's `goose` CLI rpm in this role
# (2026-09-20): the desktop bundles the very same CLI binary as its backend
# (/usr/lib/Goose/resources/bin/goose — identical GNU Build ID to the
# release tarball's), so the 13-releases-stale Fedora CLI became a second
# `goose` on the machine reading the same ~/.config/goose for nothing. The
# removal below is what "replace" means; the sessions database the two
# would have shared migrates forward additively (schema 13 -> 16), so an
# old CLI never corrupted anything — it was merely redundant.
#
# Upstream ships no repo: per release, an UNSIGNED electron-forge rpm named
# `Goose` (capital G — the package_facts key), a -vulkan twin (bundled
# local-inference on Vulkan, irrelevant here), a .deb and a single-file
# flatpak BUNDLE. The rpm is the route: the bundle is sealed (no remote, so
# `flatpak update` can't touch it; community.general.flatpak can't manage
# bundles) and sandboxed with the runtime's /etc, which would hide the
# /etc/goose layer below. Install goes through the shared
# roles/common/tasks/goose_desktop_install.yml (tempfile + get_url + dnf5
# from a path, disable_gpg_check permanent — see that file). The app does
# NOT self-update on the rpm — electron-updater's Linux path is
# AppImage-only and its GitHub fallback looks for an asset upstream never
# publishes — so the updates role tracks releases/latest and re-runs the
# include. Layout: /usr/lib/Goose (Electron 43 + backend, ~610 MB),
# /usr/bin/Goose launcher symlink, /usr/share/applications/Goose.desktop,
# /usr/share/pixmaps/Goose.png. No scriptlets, no conflicts.
#
# THE CONFIG LAYER IS UNCHANGED: the desktop's backend is `goose serve
# --platform desktop`, the same config crate, so /etc/goose/config.yaml is
# merged UNDER ~/.config/goose/config.yaml exactly as for the CLI (verified
# in config/base.rs at 1.51.0 and in the binary's strings). With it in
# place the first launch skips the provider wizard (GOOSE_PROVIDER is set),
# skips the telemetry consent dialog (GOOSE_TELEMETRY_ENABLED is present),
# treats litellm as CONFIGURED — the built-in litellm provider's configured
# check is "LITELLM_HOST set OR a key stored" (providers/init.rs). The proxy
# is keyed, so goose's own virtual key goes into ~/.config/goose/secrets.yaml
# (the section below). The first launch writes ONE thing to
# ~/.config/goose/config.yaml — an `extensions:` block syncing the bundled
# extensions (developer on, four off) — which merges per entry with the
# layer below and never touches its keys. Your own choices (Settings) land
# in that user file and win. Desktop-side Electron state lives in
# ~/.config/Goose (capital G: settings.json, window state, Chromium
# profile, its SingletonLock — which the hostname role's sweep already
# covers), backend state in ~/.config/goose, ~/.local/share/goose
# (sessions.db) and ~/.local/state/goose (logs) — all unmanaged. It shows a
# tray icon, which the appindicator role makes visible.
#
# PATH inside Goose is NOT your shell's: the backend inherits gnome-shell's
# PATH (/usr/local/bin:/usr/bin) with /usr/lib/Goose/resources/bin in
# front, and that dir holds Hermit SHIMS named uvx/npx/node that download
# their own python/uv/node into ~/.config/goose/mcp-hermit on first use
# (logging to a fixed /tmp/mcp.log). So MCP extension commands see the
# shims, not the host's uv or mise's node, and nothing under ~/.local/bin
# or ~/.opencode/bin is visible to extension launches — name absolute paths
# in extension configs. Upstream quirks, documented rather than fought.
#
# WINDOW BINDING (the claude_desktop rule, applied the sanctioned way):
# Electron 43 runs as a native Wayland client on GNOME 50 and derives its
# app_id from productName — `goose`, lowercase — while the vendor entry is
# `Goose.desktop` with no StartupWMClass and no StartupNotify. GNOME Shell's
# matcher is exact and case-sensitive (StartupWMClass, then
# "<app_id>.desktop" as-is and lowercased with vendor prefixes, then a
# startup-notification token GIO only mints for StartupNotify=true entries),
# so as shipped the window gets a generic icon and no dock binding. The fix
# is a shadow ~/.local/share/applications/Goose.desktop GENERATED from the
# vendor file on every run (slurp -> insert StartupWMClass=goose +
# StartupNotify=true right after the [Desktop Entry] header -> copy) — the
# brave pattern, never a vendored snapshot: Exec/Icon/MimeType stay whatever
# Goose currently ships. StartupWMClass is the ONLY lever that binds:
# StartupNotify=true just completes the launch spinner cleanly (Chromium
# consumes the xdg-activation token, but mutter never turns that into the
# startup id gnome-shell's matcher reads) — the app_id/StartupWMClass match
# is what does the binding. The updates role runs first, so an upgrade is
# re-shadowed in the same play. Inserted after the header, not appended:
# the vendor file has NO trailing newline (an append would glue the key onto
# the MimeType line) and a future [Desktop Action] group would otherwise
# swallow it.

# --- replace the CLI rpm ------------------------------------------------
# autoremove sweeps its orphaned deps (the dnf5 MODULE only does with the
# flag — the battery/brave lesson). Guarded for the offline re-run.
- name: Remove Fedora's goose CLI rpm (the desktop bundles the same CLI)
  become: true
  ansible.builtin.dnf5:
    name: goose
    state: absent
    autoremove: true
  when: "'goose' in ansible_facts.packages"

# --- the desktop app ------------------------------------------------------
# releases/latest is a 302 to /releases/tag/<tag>: the Location header is
# the tag with no api.github.com call (the ollama trick). uri has no
# check-mode support and is skipped under --check, so the include guards
# on .location.
- name: Look up the latest Goose release tag
  ansible.builtin.uri:
    url: https://github.com/aaif-goose/goose/releases/latest
    follow_redirects: none
    status_code: 302
  register: goose_latest
  changed_when: false
  when: "'Goose' not in ansible_facts.packages"

- name: Install the latest Goose desktop release
  ansible.builtin.include_role:
    name: common
    tasks_from: goose_desktop_install
  vars:
    goose_install_tag: "{{ goose_latest.location | basename }}"
  when: "'Goose' not in ansible_facts.packages and goose_latest.location is defined"

# --- the config layer (see the header) ------------------------------------
- name: Ensure /etc/goose exists
  become: true
  ansible.builtin.file:
    path: /etc/goose
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Install the system goose config pointing at litellm
  become: true
  ansible.builtin.template:
    src: config.yaml.j2
    dest: /etc/goose/config.yaml
    owner: root
    group: root
    mode: "0644"
  register: goose_layer

# --- the litellm virtual key --------------------------------------------
# With the proxy keyed, goose sends `Authorization: Bearer $LITELLM_API_KEY`
# — a SECRET, which goose never reads from config.yaml: env, then the
# keyring, then ~/.config/goose/secrets.yaml (a plain mapping, 0600). The
# layer above turns the keyring off, so the file is the store. The litellm
# role minted `~/.config/litellm/keys/goose`; this copies it in, MERGING
# into whatever other secrets goose has stored and gating on the LOGICAL
# value, not bytes — goose rewrites the file with its own YAML formatting
# whenever it stores a secret, and a bytes comparison would flip-flop
# against it forever (the claude_code settings.json lesson). $HOME, NO
# become. Skipped while the key file doesn't exist yet (a fresh --check, or
# a run where the proxy never came up): goose then runs keyless and gets a
# 401 until the next play.
- name: Probe for the goose client key
  ansible.builtin.stat:
    path: "{{ lookup('env', 'HOME') }}/.config/litellm/keys/goose"
  register: goose_client_key_file
  check_mode: false

- name: Read the goose client key
  ansible.builtin.slurp:
    src: "{{ lookup('env', 'HOME') }}/.config/litellm/keys/goose"
  register: goose_client_key_raw
  no_log: true
  when: goose_client_key_file.stat.exists

- name: Read goose's current secrets file (absent on a fresh machine)
  ansible.builtin.slurp:
    src: "{{ lookup('env', 'HOME') }}/.config/goose/secrets.yaml"
  register: goose_secrets_raw
  no_log: true
  failed_when: false
  check_mode: false
  when: goose_client_key_file.stat.exists

- name: Parse goose's secrets, defaulting to empty
  ansible.builtin.set_fact:
    goose_secrets: >-
      {{ (goose_secrets_raw.content | b64decode | from_yaml)
         if (goose_secrets_raw.content is defined
             and (goose_secrets_raw.content | b64decode | trim | length) > 0)
         else {} }}
    goose_client_key: "{{ goose_client_key_raw.content | b64decode | trim }}"
  no_log: true
  when: goose_client_key_file.stat.exists

- name: Ensure ~/.config/goose exists
  ansible.builtin.file:
    path: "{{ lookup('env', 'HOME') }}/.config/goose"
    state: directory
    mode: "0755"
  when: goose_client_key_file.stat.exists

- name: Store the litellm virtual key in goose's secrets
  ansible.builtin.copy:
    dest: "{{ lookup('env', 'HOME') }}/.config/goose/secrets.yaml"
    content: "{{ goose_secrets | combine({'LITELLM_API_KEY': goose_client_key}) | to_nice_yaml }}"
    mode: "0600"
  no_log: true
  when:
    - goose_client_key_file.stat.exists
    - (goose_secrets.LITELLM_API_KEY | default('')) != goose_client_key

# --- the launcher shadow (see the header) ---------------------------------
# Absent on a fresh --check (the rpm was only simulated) — the stat gate
# keeps the slurp from crashing the dry run, the brave pattern.
- name: Probe for the vendor Goose desktop entry
  ansible.builtin.stat:
    path: /usr/share/applications/Goose.desktop
  register: goose_vendor_entry
  check_mode: false

- name: Read the vendor Goose desktop entry
  ansible.builtin.slurp:
    src: /usr/share/applications/Goose.desktop
  register: goose_vendor_desktop
  when: goose_vendor_entry.stat.exists

- name: Ensure ~/.local/share/applications exists
  ansible.builtin.file:
    path: "{{ lookup('env', 'HOME') }}/.local/share/applications"
    state: directory
    mode: "0755"

# The block is a YAML block scalar so the inserted newline is a real one
# (the reaper-mouse.ini lesson: a \n inside the Jinja literal is not).
# count=1 pins the FIRST [Desktop Entry] header; the content ends with a
# newline the vendor file lacks.
- name: Generate the Goose launcher shadow that binds the window (StartupWMClass=goose)
  ansible.builtin.copy:
    dest: "{{ lookup('env', 'HOME') }}/.local/share/applications/Goose.desktop"
    content: |
      {{ (goose_vendor_desktop.content | b64decode)
         | regex_replace('(?m)^\[Desktop Entry\]$', goose_desktop_header_block, count=1) }}
    mode: "0644"
  vars:
    goose_desktop_header_block: |-
      [Desktop Entry]
      StartupWMClass=goose
      StartupNotify=true
  when: goose_vendor_entry.stat.exists
  register: goose_shadow

# Rebuild the user mimeinfo cache so the shell picks the shadow (and its
# goose:// handler claim) up without a fresh login. Inline and gated on
# change, the claude_desktop pattern: the command can never report
# unchanged on its own.
- name: Refresh the desktop database after writing the Goose shadow # noqa: no-handler
  ansible.builtin.command: >-
    update-desktop-database {{ lookup('env', 'HOME') }}/.local/share/applications
  when: goose_shadow is changed
  changed_when: goose_shadow is changed

- name: Report the Goose setup
  ansible.builtin.debug:
    msg: >-
      Goose (desktop) is configured for litellm ({{ llm_default_model }}) —
      launch it from the app grid; the first window skips the provider
      wizard. Switch models in Settings — your choice lands in
      ~/.config/goose/config.yaml and wins over the system layer; edit
      llm_default_model in site.yml to change the repo default. The same
      1.51-series CLI is at /usr/lib/Goose/resources/bin/goose if you want
      a terminal `goose`.
  when: goose_layer is changed and not ansible_check_mode
