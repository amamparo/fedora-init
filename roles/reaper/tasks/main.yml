---
# REAPER DAW with the Reapertips theme, its icons and fonts, the extensions,
# the settings from Reapertips' own "Perfect Setup" guide, and navigation
# reshaped toward Ableton Live's.
#
# REAPER ships no rpm and no dnf repo: the documented Linux install is the
# official tarball's install-reaper.sh (verified: --install /opt,
# --integrate-sys-desktop for the system .desktop entry, --usr-local-bin-symlink
# for /usr/local/bin/reaper). The binary does NOT self-update on Linux and the
# updates role can't see it, so "latest" means latest at install time and the
# launcher's presence is the terminal state (the jetbrains_toolbox rule).
# https://www.reaper.fm/latestversion/ serves the current version as the first
# line of plain text; the tarball URL is derived from it (7.77 ->
# files/7.x/reaper777_linux_x86_64.tar.xz — verified live). x86_64 is
# hardcoded like multimedia's intel-media-driver: this repo targets one
# machine, not a fleet.
#
# Everything below the install itself is user-session state under
# ~/.config/REAPER (the resource path) — NO become anywhere there, the dconf
# rule: run as root it would configure root's REAPER.
#
# REAPER is licensed shareware (60-day evaluation, then buy a license): the
# role installs and configures it, the nag screen is between aaron and Cockos.

- name: Resolve the theme identifiers used by the template and the tasks
  ansible.builtin.set_fact:
    # Named once so tasks/main.yml and templates/reaper.ini.j2 can never drift.
    reaper_theme_file: Reapertips Theme.ReaperThemeZip

- name: Probe for an installed REAPER (/opt/REAPER/reaper)
  ansible.builtin.stat:
    path: /opt/REAPER/reaper
  register: reaper_binary
  check_mode: false

- name: Install REAPER via the official tarball
  when: not reaper_binary.stat.exists
  block:
    # tempfile has no check-mode support: under --check it's skipped and
    # registers no .path — downstream tasks guard on that (claude_code
    # pattern) so a fresh --check stays clean.
    - name: Create a temp dir to hold the tarball
      ansible.builtin.tempfile:
        state: directory
        prefix: reaper-install.
      register: reaper_tmp

    # First line only: the endpoint appends changelog lines after the
    # version. check_mode: false is safe — read-only network probe — but the
    # whole block is guarded, so it only ever runs when REAPER is missing;
    # a converged re-run never touches the network (hard requirement).
    - name: Look up the latest REAPER version (reaper.fm/latestversion)
      ansible.builtin.uri:
        url: https://www.reaper.fm/latestversion/
        return_content: true
      register: reaper_latest
      when: reaper_tmp.path is defined
      changed_when: false

    - name: Derive the tarball URL from the version
      ansible.builtin.set_fact:
        # "7.77" -> "777"; the files/ tree is bucketed by major ("7.x").
        reaper_version: "{{ reaper_latest.content.splitlines() | first | trim }}"
      when: reaper_tmp.path is defined

    - name: Download the REAPER tarball
      ansible.builtin.get_url:
        url: >-
          https://www.reaper.fm/files/{{ reaper_version.split('.')[0] }}.x/reaper{{ reaper_version | replace('.', '') }}_linux_x86_64.tar.xz
        dest: "{{ reaper_tmp.path }}/reaper.tar.xz"
        mode: "0644"
      when: reaper_tmp.path is defined

    - name: Unpack the tarball
      ansible.builtin.unarchive:
        src: "{{ reaper_tmp.path }}/reaper.tar.xz"
        dest: "{{ reaper_tmp.path }}"
        remote_src: true
      when: reaper_tmp.path is defined

    # The installer writes /opt and /usr/share desktop entries: the one
    # system mutation in this role, so the one become. --quiet suppresses
    # the interactive prompts (verified against the script's usage text).
    - name: Run install-reaper.sh (installs to /opt, desktop entry, PATH symlink)
      ansible.builtin.command:
        argv:
          - bash
          - "{{ reaper_tmp.path }}/reaper_linux_x86_64/install-reaper.sh"
          - --install
          - /opt
          - --integrate-sys-desktop
          - --usr-local-bin-symlink
          - --quiet
      become: true
      when: reaper_tmp.path is defined
      changed_when: true

  always:
    - name: Remove the downloaded tarball and temp dir
      ansible.builtin.file:
        path: "{{ reaper_tmp.path }}"
        state: absent
      when: reaper_tmp.path is defined

# --- fonts the theme calls for ---------------------------------------------
# The Quick Start Guide's step 1: Roboto Bold + Fira Sans (Regular/Bold).
# Roboto is stock Fedora (google-roboto-fonts) — dnf, package-facts guarded.
# Fira Sans has no Fedora package (checked: `dnf5 search fira` is empty), so
# the theme's own ttfs are bundled and installed per-user; fontconfig picks
# up ~/.local/share/fonts automatically, fc-cache just makes it immediate.

- name: Install Roboto (theme font, stock Fedora package)
  ansible.builtin.dnf5:
    name: google-roboto-fonts
    state: present
  become: true
  when: "'google-roboto-fonts' not in ansible_facts.packages"

- name: Ensure the user font dir exists
  ansible.builtin.file:
    path: "{{ lookup('env', 'HOME') }}/.local/share/fonts"
    state: directory
    mode: "0755"

- name: Install the Fira Sans fonts (bundled with the theme)
  ansible.builtin.copy:
    src: "fonts/{{ item }}"
    dest: "{{ lookup('env', 'HOME') }}/.local/share/fonts/{{ item }}"
    mode: "0644"
  loop:
    - FiraSans-Regular.ttf
    - FiraSans-Bold.ttf
  notify: Refresh the font cache

# --- Reapertips theme + icons ----------------------------------------------
# The GUI install ("drag the .ReaperThemeZip into REAPER") decomposes into:
# the file landing in <resource>/ColorThemes/ and reaper.ini's lastthemefn5
# pointing at it (selection is part of the settings seed below). REAPER loads
# the theme zipped — never extract it.
#
# VENDORED, not fetched, like every asset in this section: the theme is a
# CC BY-NC-SA 4.0 work (attribution in files/reapertips-license.txt, installed
# alongside it), which makes committing it legitimate, and a vendored theme
# needs no network at all — so a fresh install works offline. It is a paid
# download (Payhip, pay-what-you-want) with no stable URL to fetch anyway.
#
# Vendored from the "Reapertips Theme v1.93b" package. The outer filename is
# deliberately unversioned so lastthemefn5 survives updates, but the VERSION IS
# STILL DISCOVERABLE — it's the folder inside the zip:
#   python3 -m zipfile -l 'roles/reaper/files/Reapertips Theme.ReaperThemeZip'
#   -> ReaperTips_v1.93/   (the previous vendored copy was Reapertips_v1.90_Dark)
#
# THE DARK VARIANT is this file: the package ships the main theme plus five
# variations (Dark with Light Menus, Light, Hybrid, Green, Purple) and the main
# one IS the dark build — verified by colour rather than by the guide's word:
# col_arrangebg #424242, genlist_bg #323232, col_main_text #a0a0a0, where Light
# is #bdbdbd/#d1d1d1/#242424, Hybrid lightens the arrange to #a3a3a3 and the
# "Dark with Light Menus" (_LM) build keeps #424242 but flips lists to #d2d2d2.
# The five variations are deliberately NOT vendored — dead weight at ~3.5 MB
# each for a single-machine repo; re-download the package to try one.

- name: Ensure the REAPER resource dirs exist
  ansible.builtin.file:
    path: "{{ lookup('env', 'HOME') }}/.config/REAPER/{{ item }}"
    state: directory
    mode: "0755"
  loop:
    - ColorThemes
    - Data/toolbar_icons
    - Data/track_icons
    - UserPlugins
    - Scripts

- name: Install the Reapertips theme, dark variant (CC BY-NC-SA 4.0, by Alejandro Hernandez)
  ansible.builtin.copy:
    src: "{{ reaper_theme_file }}"
    dest: "{{ lookup('env', 'HOME') }}/.config/REAPER/ColorThemes/{{ reaper_theme_file }}"
    mode: "0644"

# The theme's Linux extra, shipped in the package's 03_Extras/Linux Colortheme
# and installed verbatim: libSwell-user.colortheme darkens REAPER's GTK-less
# Swell widgets (dialogs, menus) — the tarball build has no GTK theming, so
# this file IS "dark mode" on Linux, the thing REAPER exposes as a setting only
# on Windows. Goes in the resource path root per the bundled !howtouse.txt.
#
# It is what completes the dark variant: the theme paints its own lists at
# #323232 with #a0a0a0 text, and Swell dialogs left stock would be the only
# light surfaces left in the app.
#
# Theme-specific, NOT universally safe. It was deleted for one revision, while
# this role shipped a Default-7.0-derived theme whose dialogs are light BY
# DESIGN (near-black text on #dcdede) — forcing Swell dark there put black text
# on a dark ground and made button labels invisible. The override travels with
# the theme: if the theme ever changes again, re-check this task with it.
#
# It also carries the only lever REAPER has for the SIZE of those dialogs on
# Linux. The file is not colours-only: its first nine lines are METRICS, and
# they are first-class documented keys — REAPER ships the same nine at the top
# of its own reference template, /opt/REAPER/libSwell.colortheme, which is the
# place to check what else is settable. Reapertips leaves all nine at REAPER's
# defaults and changes only colours below them.
#
# Those defaults are cramped on a 1680x1050 logical panel, which is what makes
# the Media Explorer, the action list, the FX browser and Preferences fiddly to
# hit: a 13px control font, 14px scrollbars with a 4px minimum thumb (a
# genuinely hard target), and 20px combo boxes. reaper_swell_metrics below
# bumps them; everything else in the file passes through verbatim.
#
# TO RETUNE, edit the numbers below — they are the whole interface. Values are
# raw pixels, and default_font_size is the one with a trade-off: SWELL dialogs
# are laid out in fixed pixel geometry, so a large jump can CLIP labels in
# dense dialogs (Preferences is the one to check). The scrollbar/combo values
# carry no such risk — they are pure hit-target size, independent of the font,
# so text size and click-target size can be tuned against each other.
#
# GRANULARITY, since 13 -> 15 overshot and 14 is where this landed: the size is
# INTEGER PIXELS, so 14 is the only step between stock and 15 — there is no
# fractional size here. The only sub-step lever is default_font_face, and it
# barely moves: measured x-height/em is 0.5283 for Liberation Sans (the
# vendor's choice), 0.5283 Roboto, 0.5270 Fira Sans, 0.5360 Noto Sans (~14.2px
# apparent at 14) and 0.4820 Cantarell (much smaller — a real step DOWN if 14
# ever reads too big). DejaVu Sans is the one face with a meaningfully larger
# x-height and it is not installed; adding a font package for ~3% is not worth
# it. For proportionally bigger EVERYTHING (arrange, TCP, MCP, transport, not
# just dialogs) the knob is REAPER's own global UI scale, not this file.
#
# Applied on theme (re)load, not only at startup — verified live: a REAPER that
# had been running for two hours picked these up when the theme was reloaded.
# A restart obviously works too.
- name: Install the Swell color theme (dark dialogs/menus, readable metrics)
  ansible.builtin.template:
    src: libSwell-user.colortheme.j2
    dest: "{{ lookup('env', 'HOME') }}/.config/REAPER/libSwell-user.colortheme"
    mode: "0644"
  vars:
    # The vendored file, verbatim, as the base the template rewrites.
    reaper_swell_vendor_lines: "{{ lookup('file', role_path ~ '/files/libSwell-user.colortheme').splitlines() }}"
    reaper_swell_metrics:
      default_font_size: 14 # stock 13 — every dialog/list control font
      menubar_height: 20 # stock 17
      menubar_font_size: 14 # stock 12
      scrollbar_width: 17 # stock 14
      scrollbar_min_thumb_height: 20 # stock 4 — the worst offender
      combo_height: 24 # stock 20 — dropdown hit target

# Icon packs merge ADDITIVELY into Data/ — deliberately not the
# gnome_extension mirror: --delete would remove icons aaron imports by hand,
# and REAPER treats these dirs as a user-extended pool, not a repo-owned
# tree. --checksum/--omit-dir-times are the same convergence guards as
# gnome_extension (git-checkout vs tarball mtimes differ for identical
# content).
#
# files/toolbar_icons is a pre-merged union of TWO Reapertips products, and
# the prefixes are what tell them apart — get this wrong and a theme update
# deletes the expensive half:
#   RTH_  257 files — the THEME package's own icons (86 at 1x, 86 at 150,
#         85 at 200). These ship inside the theme zip's 04_Toolbar Icons and
#         are the ones a theme update refreshes.
#   RT_  2265 files — the separate "Essential Icons for REAPER" pack (755
#         icons x 3 scales), a different paid download that is NOT part of the
#         theme package. A theme update must leave these alone.
# Verified zero filename overlap between the two; the 3 icons unique to the
# Essential pack's Update/ dir are included (its other 123 are byte-identical
# to the main pack). files/track_icons (303 files in 12 category dirs) is
# likewise Essential Icons, not theme-package, content.
#
# Both trees are flat 1x/150/200 layouts, so "150" is a SCALE dir, not a
# prefix distinction — RT_ and RTH_ each appear at all three scales.
- name: Merge the toolbar icons into the resource path
  ansible.posix.synchronize:
    src: "{{ role_path }}/files/toolbar_icons/"
    dest: "{{ lookup('env', 'HOME') }}/.config/REAPER/Data/toolbar_icons/"
    recursive: true
    rsync_opts:
      - "--checksum"
      - "--omit-dir-times"

- name: Merge the track icons into the resource path
  ansible.posix.synchronize:
    src: "{{ role_path }}/files/track_icons/"
    dest: "{{ lookup('env', 'HOME') }}/.config/REAPER/Data/track_icons/"
    recursive: true
    rsync_opts:
      - "--checksum"
      - "--omit-dir-times"

# The theme's color palette for the Rodilab Color Palette script (a ReaPack
# package — installing scripts through ReaPack isn't automatable offline, so
# loading this stays a manual step surfaced in the nudge below).
- name: Stage the Reapertips color palette (for the Rodilab script)
  ansible.builtin.copy:
    src: ReapertipsTheme_ColorPalette.txt
    dest: "{{ lookup('env', 'HOME') }}/.config/REAPER/Data/ReapertipsTheme_ColorPalette.txt"
    mode: "0644"

- name: Install the Reapertips license/attribution alongside the assets
  ansible.builtin.copy:
    src: reapertips-license.txt
    dest: "{{ lookup('env', 'HOME') }}/.config/REAPER/Data/reapertips-license.txt"
    mode: "0644"

# --- SWS + ReaPack extensions -----------------------------------------------
# Both are pure file drops into the resource path. Presence of the .so is
# terminal (same network discipline as the REAPER install: fetch only when
# missing, offline re-run untouched).

- name: Probe for the SWS extension
  ansible.builtin.stat:
    path: "{{ lookup('env', 'HOME') }}/.config/REAPER/UserPlugins/reaper_sws-x86_64.so"
  register: sws_plugin
  check_mode: false

- name: Install the SWS extension
  when: not sws_plugin.stat.exists
  block:
    - name: Create a temp dir for the SWS tarball
      ansible.builtin.tempfile:
        state: directory
        prefix: sws-install.
      register: sws_tmp

    # The homepage's featured download is the only stable "latest" pointer
    # (no /latest endpoint, no GitHub releases with binaries). The href is
    # relative: download/featured/sws-<ver>-Linux-x86_64.tar.xz.
    - name: Find the current SWS Linux build on sws-extension.org
      ansible.builtin.uri:
        url: https://www.sws-extension.org/
        return_content: true
      register: sws_page
      when: sws_tmp.path is defined
      changed_when: false

    - name: Download the SWS tarball
      ansible.builtin.get_url:
        url: >-
          https://www.sws-extension.org/{{ sws_page.content | regex_search('href="(download/featured/sws-[^"]*-Linux-x86_64\.tar\.xz)"', '\1') | first }}
        dest: "{{ sws_tmp.path }}/sws.tar.xz"
        mode: "0644"
      when: sws_tmp.path is defined

    - name: Unpack the SWS tarball
      ansible.builtin.unarchive:
        src: "{{ sws_tmp.path }}/sws.tar.xz"
        dest: "{{ sws_tmp.path }}"
        remote_src: true
      when: sws_tmp.path is defined

    # The tarball is a resource-path overlay (verified layout: UserPlugins/
    # with the .so, Scripts/ with the python bridge, Data/ with grooves) —
    # copy the whole tree over ~/.config/REAPER. rsync without --delete for
    # the same merge-not-mirror reason as the icons.
    - name: Copy the SWS payload into the resource path
      ansible.posix.synchronize:
        src: "{{ sws_tmp.path }}/"
        dest: "{{ lookup('env', 'HOME') }}/.config/REAPER/"
        recursive: true
        rsync_opts:
          - "--exclude=sws.tar.xz"
          - "--checksum"
          - "--omit-dir-times"
      when: sws_tmp.path is defined

  always:
    - name: Remove the SWS temp dir
      ansible.builtin.file:
        path: "{{ sws_tmp.path }}"
        state: absent
      when: sws_tmp.path is defined

- name: Probe for ReaPack
  ansible.builtin.stat:
    path: "{{ lookup('env', 'HOME') }}/.config/REAPER/UserPlugins/reaper_reapack-x86_64.so"
  register: reapack_plugin
  check_mode: false

# Single .so straight from the project's stable latest-release URL; no
# tarball, no scrape. GitHub's /releases/latest/download/ redirects to the
# current version.
- name: Install ReaPack
  ansible.builtin.get_url:
    url: https://github.com/cfillion/reapack/releases/latest/download/reaper_reapack-x86_64.so
    dest: "{{ lookup('env', 'HOME') }}/.config/REAPER/UserPlugins/reaper_reapack-x86_64.so"
    mode: "0644"
  when: not reapack_plugin.stat.exists

# --- retired theme removal --------------------------------------------------
# Between Reapertips revisions this role shipped rLive, then paRt, then
# LCS_Flat-7. Only LCS_Flat-7 was ever vendored into the resource path (the
# other two were fetched and are already gone), so it is the only one with
# files to sweep. These tasks stay PERMANENTLY, the claude_desktop state:
# absent precedent: a machine that ran that revision still has both files on
# disk and nothing else would ever clean them up. On a machine that never did,
# both are no-ops.
- name: Remove the retired LCS_Flat-7 theme and its notice
  ansible.builtin.file:
    path: "{{ lookup('env', 'HOME') }}/.config/REAPER/ColorThemes/{{ item }}"
    state: absent
  loop:
    - LCS_Flat-7.ReaperThemeZip
    - LCS_Flat-7-NOTICE.txt

# --- first-run settings -----------------------------------------------------
# reaper.ini is rewritten by REAPER on every exit — managing it converged
# would fight the app the same way claude_desktop_config.json would (the
# rewrite-at-runtime trap), so the role SEEDS it only when absent: on a
# fresh machine REAPER's first run adopts these values and fills in its own
# defaults for everything else; after that the file belongs to REAPER.
# Every key in the template was verified against mespotine's config-var
# documentation (github.com/mespotine/ultraschall-and-reaper-docs) — settings
# whose keys could NOT be verified are deliberately left to the manual nudge
# below rather than guessed.
#
# A large share of the values come from Alejandro Hernandez's "Perfect Setup"
# guide, vendored at docs/reapertips-perfect-setup.pdf — same author as the
# theme this role installs. That reference is REAPER 5.95-era, so the guide's
# REAPER-7-only tips (track spacers, folder-collapse modes, the item selection
# indicator, render block size) have NO documented variable and are in the
# manual nudge with their page numbers rather than reverse-engineered.

- name: Probe for an existing reaper.ini
  ansible.builtin.stat:
    path: "{{ lookup('env', 'HOME') }}/.config/REAPER/reaper.ini"
  register: reaper_ini
  check_mode: false

# The seed points auto-save backups and the peak cache at dedicated dirs —
# they must exist before REAPER first tries to write into them.
- name: Ensure the backup and peak-cache dirs exist
  ansible.builtin.file:
    path: "{{ lookup('env', 'HOME') }}/Music/REAPER/{{ item }}"
    state: directory
    mode: "0755"
  loop:
    - Backups
    - Peaks

- name: Seed reaper.ini with the first-run defaults (first run only)
  ansible.builtin.template:
    src: reaper.ini.j2
    dest: "{{ lookup('env', 'HOME') }}/.config/REAPER/reaper.ini"
    mode: "0644"
  when: not reaper_ini.stat.exists
  register: reaper_seeded

# --- migrating an already-configured machine --------------------------------
# The seed above fires only when reaper.ini is ABSENT, so on a machine that
# has already run REAPER a new template changes nothing. The two things worth
# carrying across anyway get additive-probe treatment (the Nautilus bookmark
# rule): applied only when REAPER has no opinion of its own, so a later
# in-app change always wins and this can never flip-flop.
#
# Caveat shared by every reaper.ini and reaper-kb.ini task below: REAPER must
# not be RUNNING. It dumps its in-memory config at exit and would drop a line
# added underneath it. That is self-healing — the next run re-adds it.

- name: Probe reaper.ini for a retired theme selection
  ansible.builtin.command:
    argv:
      - grep
      - -Eq
      - ^lastthemefn5=.*ColorThemes/(LCS_Flat-7|rLive|part_)
      - "{{ lookup('env', 'HOME') }}/.config/REAPER/reaper.ini"
  register: reaper_old_theme
  failed_when: false
  changed_when: false
  check_mode: false
  when: reaper_ini.stat.exists

# Gated on finding an OLD value, so it fires exactly once per machine and can
# never override a theme aaron picks in-app later. Deleting reaper.ini to
# force a reseed was rejected: it would also destroy REAPER's audio-device
# config, window positions and MIDI hardware state.
- name: Repoint the theme selection at the current theme (one-time migration)
  ansible.builtin.lineinfile:
    path: "{{ lookup('env', 'HOME') }}/.config/REAPER/reaper.ini"
    regexp: ^lastthemefn5=
    line: lastthemefn5={{ lookup('env', 'HOME') }}/.config/REAPER/ColorThemes/{{ reaper_theme_file }}
    mode: "0644"
  when:
    - reaper_ini.stat.exists
    - reaper_old_theme.rc is defined
    - reaper_old_theme.rc == 0

# REAPER only writes a key once it differs from the built-in default, so
# "absent" reliably means aaron has never expressed an opinion and adding the
# key then is safe. Once present — written by us, by REAPER, or by his own
# Preferences change — the probe skips it forever, which is what stops this
# from flip-flopping against the app's rewrite-at-exit.
#
# One entry per key, probed individually: a joint probe would skip the whole
# set as soon as any one member existed. Values and the reasoning behind them
# live in templates/reaper.ini.j2 — this list only decides which of them are
# worth back-filling onto an ALREADY-CONFIGURED machine, and must be kept in
# sync with the template (see its header).
- name: Probe reaper.ini for the keys worth back-filling
  ansible.builtin.command:
    argv:
      - grep
      - -Eq
      - ^{{ item.key }}=
      - "{{ lookup('env', 'HOME') }}/.config/REAPER/reaper.ini"
  register: reaper_ini_probe
  failed_when: false
  changed_when: false
  check_mode: false
  vars:
    reaper_ini_keys:
      # Ableton-shaped zoom — the feel-critical pair, here since the theme
      # detour: 0 = zoom around the edit/play cursor (Live anchors zoom on the
      # selection), 3 = vertical zoom on the track under the mouse (Live's
      # Option+scroll). Deliberately NOT the guide's p25 "mouse cursor" for the
      # horizontal one — that is the one navigation fork taken away from it.
      - {key: zoommode, value: 0, why: "zoom around the cursor (Live)"}
      - {key: vzoommode, value: 3, why: "vertical zoom under the mouse"}
      # Reapertips "Perfect Setup" — the tips with a documented ini key.
      - {key: splitautoxfade, value: 40, why: "p39 no automatic item fades"}
      - {key: hwfadex, value: 1, why: "p40 no tiny fade-in on play"}
      - {key: itemicons, value: 823807, why: "p41 additional item buttons"}
      - {key: recaddatloop, value: 23044, why: "p50 discard incomplete takes"}
      - {key: midieditor, value: 33, why: "p65 one MIDI editor per project"}
      - {key: loopnewitems, value: 0, why: "p42 drag extends, never loops"}
      - {key: projgridmin, value: 18, why: "p26 uncluttered grid lines"}
  loop: "{{ reaper_ini_keys }}"
  loop_control:
    label: "{{ item.key }} ({{ item.why }})"
  when: reaper_ini.stat.exists

# insertafter the [REAPER] header, because a bare append would land the key
# in whichever section happens to be last (the file has 21 of them).
- name: Back-fill the missing keys into an existing reaper.ini
  ansible.builtin.lineinfile:
    path: "{{ lookup('env', 'HOME') }}/.config/REAPER/reaper.ini"
    line: "{{ item.item.key }}={{ item.item.value }}"
    insertafter: ^\[REAPER\]
    mode: "0644"
  loop: "{{ reaper_ini_probe.results }}"
  loop_control:
    label: "{{ item.item.key }} ({{ item.item.why }})"
  when: item.rc is defined and item.rc != 0
  register: reaper_ini_backfill

# --- Ableton-shaped wheel navigation ----------------------------------------
# Theme-independent, and the half of the Ableton experiment worth keeping:
# the look went back to Reapertips, the navigation stayed.
#
# Two-finger scroll arrives as REAPER's wheel input, which is NOT a
# mouse-modifier context — verified against the 7.78 binary, whose only wheel
# contexts are MM_CTX_{TCP,MCP}_MOUSE{,H}WHEEL and the fader ones. Arrange
# wheel behaviour can therefore ONLY be expressed as reaper-kb.ini keyboard
# bindings: `KEY <mod> <key> <cmd> <section>`, where mod is always 255 for
# wheel input and the KEY field encodes both axis and modifier —
# vertical 248 bare / 249 Ctrl / 250 Alt / 252 Shift, horizontal 216 bare.
# (88 is a legacy alias for the horizontal wheel — don't use it.)
#
# Direction: SWELL sends +120 for both GDK_SCROLL_UP and GDK_SCROLL_LEFT.
# +120 for UP matches the Windows convention REAPER expects, so vertical
# actions need no reversal; +120 for LEFT is inverted (Windows sends positive
# for RIGHT), which is why the horizontal binding uses the *reversed* action
# 977 rather than 988. That is a SWELL bug being compensated, not a GNOME
# natural-scroll setting — changing GNOME's scroll direction will not undo it.
#
# Ableton parity, with Cmd -> Ctrl (macOS bit 2 is Command; on Linux it's
# Ctrl — never Super, which mutter owns):
#   bare scroll        -> scroll tracks vertically      (Live: same)
#   Shift + scroll     -> scroll the timeline           (Live: same)
#   Ctrl  + scroll     -> zoom time                     (Live: Cmd+scroll)
#   Alt   + scroll     -> track height                  (Live: Option+scroll)
# Live's pinch-to-zoom has no substitute: SWELL's SWELL_GetGestureInfo() is an
# unconditional `return FALSE` and it never posts WM_GESTURE, so the gesture
# reaches the process and is discarded. Ctrl+scroll IS the pinch replacement.
#
# reaper-kb.ini is rewritten by REAPER whenever shortcuts change in-app, but
# unlike reaper.ini the written state PRESERVES these lines once adopted — so
# this is the additive-probe class: add a binding only when NO binding exists
# for that (modifier, key, section) triple. Any command id counts, so an
# in-app rebinding always wins.
#
# The probe is awk, not grep, because REAPER writes key values >=256 that are
# congruent mod 256 (a real `KEY 255 6396 989 0` has been seen in the wild;
# 6396 % 256 == 252). A literal grep would miss those and re-add a duplicate.

- name: Probe for existing wheel bindings
  ansible.builtin.command:
    argv:
      - awk
      - -v
      - key={{ item.key }}
      - -v
      - sect={{ item.section }}
      - $1=="KEY" && $2==255 && ($3%256)==key && $NF==sect {found=1} END{exit !found}
      - "{{ lookup('env', 'HOME') }}/.config/REAPER/reaper-kb.ini"
  register: reaper_wheel
  failed_when: false
  changed_when: false
  check_mode: false
  loop:
    - {key: 248, section: 0, cmd: 989, what: "scroll vertically"}
    - {key: 252, section: 0, cmd: 988, what: "Shift: scroll horizontally"}
    - {key: 249, section: 0, cmd: 990, what: "Ctrl: zoom horizontally"}
    - {key: 250, section: 0, cmd: 972, what: "Alt: adjust track heights"}
    - {key: 216, section: 0, cmd: 977, what: "horizontal wheel, reversed"}
    - {key: 248, section: 32060, cmd: 40432, what: "MIDI: scroll vertically"}
    - {key: 249, section: 32060, cmd: 40431, what: "MIDI: zoom horizontally"}
    - {key: 216, section: 32060, cmd: 40660, what: "MIDI: horizontal wheel, reversed"}
  loop_control:
    label: "{{ item.what }}"

- name: Bind the wheel to Ableton-shaped navigation
  ansible.builtin.lineinfile:
    path: "{{ lookup('env', 'HOME') }}/.config/REAPER/reaper-kb.ini"
    line: KEY 255 {{ item.item.key }} {{ item.item.cmd }} {{ item.item.section }}
    create: true
    mode: "0644"
  loop: "{{ reaper_wheel.results }}"
  loop_control:
    label: "{{ item.item.what }}"
  when: item.rc is defined and item.rc != 0

# --- Ableton-shaped drag navigation -----------------------------------------
# Mouse modifiers DO live in a seedable file: ~/.config/REAPER/reaper-mouse.ini,
# as [MM_CTX_*] sections of `mm_<bitmask>=<behaviourID> m` (bitmask +1 shift,
# +2 ctrl, +4 alt, +8 win; mm_8 never exists). Behaviour IDs are per-context
# indices, not a global enum — Preferences > Mouse Modifiers has an "Export
# ReaScript to set these modifiers for this context" button, which is the
# honest way to discover an id rather than guessing one.
#
# Unlike reaper.ini, this file is NOT rewritten when REAPER exits (proven by
# mtime: it predates several REAPER sessions) — only when Mouse Modifiers is
# changed in Preferences. But a seed-if-absent guard would be useless here
# because the file already exists on any machine that has run REAPER, so the
# treatment is additive PER SECTION: a section is written only when it is
# absent entirely, which leaves any in-app customisation untouched.
#
# Ruler drag is Live's headline navigation gesture — horizontal drag scrolls,
# vertical drag zooms, both from one grab on the timeline. That is behaviour
# 10, "Hand scroll and horizontal zoom". It costs the factory "Edit loop
# point", which is moved onto Ctrl+drag (mm_2=1) rather than lost.

- name: Probe reaper-mouse.ini for the drag contexts
  ansible.builtin.command:
    argv:
      - grep
      - -Fq
      - "[{{ item.context }}]"
      - "{{ lookup('env', 'HOME') }}/.config/REAPER/reaper-mouse.ini"
  register: reaper_mouse
  failed_when: false
  changed_when: false
  check_mode: false
  # The section body is carried as a literal block, NOT assembled with a Jinja
  # join: inside a YAML block scalar an escape like '\n' reaches Jinja as two
  # characters and lands in the file verbatim, silently collapsing a section
  # into one broken line (caught by running this from a clean resource path).
  loop:
    - context: MM_CTX_RULER
      what: ruler drag = scroll + zoom (Ctrl keeps loop points)
      body: |-
        [MM_CTX_RULER]
        mm_0=10 m
        mm_2=1 m
    - context: MM_CTX_ARRANGE_MMOUSE
      what: middle-drag = hand scroll
      body: |-
        [MM_CTX_ARRANGE_MMOUSE]
        mm_0=2 m
  loop_control:
    label: "{{ item.context }}"

- name: Add the Ableton-shaped drag contexts
  ansible.builtin.blockinfile:
    path: "{{ lookup('env', 'HOME') }}/.config/REAPER/reaper-mouse.ini"
    marker: "; {mark} {{ item.item.context }} (fedora-init)"
    block: "{{ item.item.body }}"
    create: true
    mode: "0644"
  loop: "{{ reaper_mouse.results }}"
  loop_control:
    label: "{{ item.item.what }}"
  when: item.rc is defined and item.rc != 0

# What the Perfect Setup guide and Ableton parity ask for but this role
# deliberately does NOT encode: settings whose ini keys aren't verifiable
# (REAPER-7-era ones are absent from the 5.95 config-var reference), mouse
# modifiers whose behaviour IDs are per-context indices that REAPER only
# reveals through its own "Export ReaScript" button, keyboard bindings for
# plain letters (the KEY-line encoding for those is self-contradictory in the
# reference — 0_101 for E but 0_81 for Q — so seeding them blind is exactly
# the guess this role refuses to make), and anything interactive.
#
# Page numbers are docs/reapertips-perfect-setup.pdf. Printed on any run that
# actually changed reaper.ini — seed OR back-fill — then quiet: the tailscale-up
# pattern, widened because a machine that already had a reaper.ini would
# otherwise never see the list at all.
- name: Remaining manual setup (not automatable)
  ansible.builtin.debug:
    msg:
      - "REAPER configured with the Reapertips theme and the Perfect Setup ini keys. Remaining:"
      - "-- first run --"
      - "1. Run `reaper` once — evaluation/license notice, then the theme loads."
      - "2. Extensions > ReaPack > Synchronize packages (installs the default repos). p77"
      - "   The Rodilab Color Palette script lives there — load"
      - "   ~/.config/REAPER/Data/ReapertipsTheme_ColorPalette.txt into it."
      - "3. Preferences > General > Export configuration, all boxes ticked, keep the"
      - "   .ReaperConfigZip somewhere safe. Do this BEFORE tweaking further. p8"
      - "-- REAPER 7 settings with no documented ini key (set these in Preferences) --"
      - "4. Appearance > Media: uncheck 'Draw selection indicator on items'. p21"
      - "5. Appearance > Track Control Panel: 'Folder collapse button cycles track"
      - "   heights' = Normal, hidden. p32"
      - "6. Appearance: 'Visual track spacer size' = 24. p35"
      - "7. Audio > Rendering: 'Block size to use when rendering' = 1024. p60"
      - "8. Track/Sends Defaults > Record config: 'Automatic record-arm when track"
      - "   is selected'. p51"
      - "9. Options > uncheck 'Show all takes (when room)', then File > Project"
      - "   Settings > Save as default project settings. p49"
      - "-- mouse modifiers (Preferences > Mouse Modifiers; IDs are per-context) --"
      - "10. Media item fade/autocrossfade | left drag > default > Move fade >"
      - "    'Relative edge edit' — lets you drag several fades at once. p37"
      - "11. Media item edge | left drag > tick 'Limit edits to source media content"
      - "    for unlooped media items' — pairs with loopnewitems=0 above. p43"
      - "12. MIDI piano roll | left click > default > Insert note > 'Just insert'. p62"
      - "-- keyboard / toolbars / layouts (all interactive) --"
      - "13. Record shortcuts: bind 1013 (Transport: Record) to E and 40668"
      - "    (Transport: Stop, DELETE all recorded media) to Q. p47"
      - "14. Build a toolbar from the 4051 icons already in Data/toolbar_icons, and"
      - "    save layouts as screensets (View > Screensets). p27, p28"
      - "15. FX browser > right click a plugin > 'Create shortcut...' for the ones you"
      - "    reach for most. p34"
      - "16. Theme tweaks live in REAPER's own adjuster (Reapertips is Default-7.0-derived,"
      - "    so the stock script drives it): Actions > Show action list >"
      - "    'Script: Default_7.0_theme_adjuster.lua' — TCP Dim track panel, folder indicator."
      - "-- Ableton parity, unfinished --"
      - "17. Option+scroll in Live resizes the track UNDER THE POINTER; the bound stock action"
      - "    (972) resizes SELECTED tracks. For true parity install SWS's 'adjust track height"
      - "    under mouse' action and rebind KEY 255 250 in reaper-kb.ini to it."
      - "18. Live's 'Z' zoom-to-selection and 'X' zoom-back-stack: bind 40031 (zoom to time"
      - "    selection) and SWS's undo-zoom action in Actions > Show action list."
      - "19. Live's left-drag on empty arrangement makes a TIME selection, never an object"
      - "    marquee: Preferences > Mouse Modifiers > Arrange view/left drag >"
      - "    'Marquee select time' if you want that."
      - "20. Two things Live does that Linux cannot: pinch-to-zoom (SWELL discards the gesture"
      - "    — use Ctrl+scroll) and smooth/inertial panning (SWELL quantises to 120-unit clicks)."
      - "NOTE: the guide's p25 'zoom towards your mouse' is deliberately NOT taken for the"
      - "HORIZONTAL axis (zoommode stays 0, cursor-anchored, which is what Live does)."
  when:
    - not ansible_check_mode
    - reaper_seeded is changed or reaper_ini_backfill is changed
