---
# REAPER DAW, themed and configured to look and feel like Ableton Live.
#
# REAPER ships no rpm and no dnf repo: the documented Linux install is the
# official tarball's install-reaper.sh (verified: --install /opt,
# --integrate-sys-desktop for the system .desktop entry, --usr-local-bin-symlink
# for /usr/local/bin/reaper). The binary does NOT self-update on Linux and the
# updates role can't see it, so "latest" means latest at install time and the
# launcher's presence is the terminal state (the jetbrains_toolbox rule).
# https://www.reaper.fm/latestversion/ serves the current version as the first
# line of plain text; the tarball URL is derived from it (7.77 ->
# files/7.x/reaper777_linux_x86_64.tar.xz — verified live). x86_64 is
# hardcoded like multimedia's intel-media-driver: this repo targets one
# machine, not a fleet.
#
# Everything below the install itself is user-session state under
# ~/.config/REAPER (the resource path) — NO become anywhere there, the dconf
# rule: run as root it would configure root's REAPER.
#
# REAPER is licensed shareware (60-day evaluation, then buy a license): the
# role installs and configures it, the nag screen is between aaron and Cockos.

- name: Resolve the theme identifiers used by the template and the fetch
  ansible.builtin.set_fact:
    # Named once so tasks/main.yml and templates/reaper.ini.j2 can never drift.
    reaper_theme_file: LCS_Flat-7.ReaperThemeZip

- name: Probe for an installed REAPER (/opt/REAPER/reaper)
  ansible.builtin.stat:
    path: /opt/REAPER/reaper
  register: reaper_binary
  check_mode: false

- name: Install REAPER via the official tarball
  when: not reaper_binary.stat.exists
  block:
    # tempfile has no check-mode support: under --check it's skipped and
    # registers no .path — downstream tasks guard on that (claude_code
    # pattern) so a fresh --check stays clean.
    - name: Create a temp dir to hold the tarball
      ansible.builtin.tempfile:
        state: directory
        prefix: reaper-install.
      register: reaper_tmp

    # First line only: the endpoint appends changelog lines after the
    # version. check_mode: false is safe — read-only network probe — but the
    # whole block is guarded, so it only ever runs when REAPER is missing;
    # a converged re-run never touches the network (hard requirement).
    - name: Look up the latest REAPER version (reaper.fm/latestversion)
      ansible.builtin.uri:
        url: https://www.reaper.fm/latestversion/
        return_content: true
      register: reaper_latest
      when: reaper_tmp.path is defined
      changed_when: false

    - name: Derive the tarball URL from the version
      ansible.builtin.set_fact:
        # "7.77" -> "777"; the files/ tree is bucketed by major ("7.x").
        reaper_version: "{{ reaper_latest.content.splitlines() | first | trim }}"
      when: reaper_tmp.path is defined

    - name: Download the REAPER tarball
      ansible.builtin.get_url:
        url: >-
          https://www.reaper.fm/files/{{ reaper_version.split('.')[0] }}.x/reaper{{ reaper_version | replace('.', '') }}_linux_x86_64.tar.xz
        dest: "{{ reaper_tmp.path }}/reaper.tar.xz"
        mode: "0644"
      when: reaper_tmp.path is defined

    - name: Unpack the tarball
      ansible.builtin.unarchive:
        src: "{{ reaper_tmp.path }}/reaper.tar.xz"
        dest: "{{ reaper_tmp.path }}"
        remote_src: true
      when: reaper_tmp.path is defined

    # The installer writes /opt and /usr/share desktop entries: the one
    # system mutation in this role, so the one become. --quiet suppresses
    # the interactive prompts (verified against the script's usage text).
    - name: Run install-reaper.sh (installs to /opt, desktop entry, PATH symlink)
      ansible.builtin.command:
        argv:
          - bash
          - "{{ reaper_tmp.path }}/reaper_linux_x86_64/install-reaper.sh"
          - --install
          - /opt
          - --integrate-sys-desktop
          - --usr-local-bin-symlink
          - --quiet
      become: true
      when: reaper_tmp.path is defined
      changed_when: true

  always:
    - name: Remove the downloaded tarball and temp dir
      ansible.builtin.file:
        path: "{{ reaper_tmp.path }}"
        state: absent
      when: reaper_tmp.path is defined

# --- LCS_Flat-7 theme -------------------------------------------------------
# LCS_Flat-7 (lucas_LCS) — REAPER's stock Default 7.0 theme with every button
# flattened. That lineage is the whole point: it declares `version 7.0`, ships
# the full 129-image toolbar set, and inherits stock's big controls and wide
# mixer strips, so it is flat AND immediately ergonomic with no adjuster
# wiring. See files/LCS_Flat-7-NOTICE.txt for licence and the one-line
# modification (custom colour strength 100 -> 45, muting how hard a track
# colour floods the panels).
#
# VENDORED, not fetched — the opposite of every other download in this role,
# and deliberately: stash.reaper.fm serves files only after a browser-side
# SHA-1 proof-of-work "verify you are human" challenge, so no get_url can
# reach it. Being a derivative of Cockos' LGPL Default 7.0 theme, it is
# redistributable, which is what makes committing it legitimate (the same
# reasoning that let the retired Reapertips theme live in git). Bonus: a
# vendored theme needs no network at all, so a fresh install works offline.
- name: Ensure the REAPER resource dirs exist
  ansible.builtin.file:
    path: "{{ lookup('env', 'HOME') }}/.config/REAPER/{{ item }}"
    state: directory
    mode: "0755"
  loop:
    - ColorThemes
    - UserPlugins
    - Scripts

# REAPER loads the theme zipped — never extract it.
- name: Install the LCS_Flat-7 theme
  ansible.builtin.copy:
    src: "{{ item }}"
    dest: "{{ lookup('env', 'HOME') }}/.config/REAPER/ColorThemes/{{ item }}"
    mode: "0644"
  loop:
    - LCS_Flat-7.ReaperThemeZip
    - LCS_Flat-7-NOTICE.txt

# The dark Swell override this role used to install is GONE, and must stay
# gone while the theme is Default-7.0-derived. LCS_Flat-7 specifies near-black
# dialog text (col_main_text #1e2222) on light list/edit backgrounds
# (genlist_bg #dcdede), because that is what stock REAPER dialogs look like.
# Forcing Swell's backgrounds dark left black text on a dark ground — button
# labels rendered effectively invisible. Stock Swell colours match this theme
# by construction, so the right move is to ship no override at all.
- name: Remove the retired dark Swell override (breaks dialog contrast here)
  ansible.builtin.file:
    path: "{{ lookup('env', 'HOME') }}/.config/REAPER/libSwell-user.colortheme"
    state: absent

# --- SWS + ReaPack extensions -----------------------------------------------
# Both are pure file drops into the resource path. Presence of the .so is
# terminal (same network discipline as the REAPER install: fetch only when
# missing, offline re-run untouched).

- name: Probe for the SWS extension
  ansible.builtin.stat:
    path: "{{ lookup('env', 'HOME') }}/.config/REAPER/UserPlugins/reaper_sws-x86_64.so"
  register: sws_plugin
  check_mode: false

- name: Install the SWS extension
  when: not sws_plugin.stat.exists
  block:
    - name: Create a temp dir for the SWS tarball
      ansible.builtin.tempfile:
        state: directory
        prefix: sws-install.
      register: sws_tmp

    # The homepage's featured download is the only stable "latest" pointer
    # (no /latest endpoint, no GitHub releases with binaries). The href is
    # relative: download/featured/sws-<ver>-Linux-x86_64.tar.xz.
    - name: Find the current SWS Linux build on sws-extension.org
      ansible.builtin.uri:
        url: https://www.sws-extension.org/
        return_content: true
      register: sws_page
      when: sws_tmp.path is defined
      changed_when: false

    - name: Download the SWS tarball
      ansible.builtin.get_url:
        url: >-
          https://www.sws-extension.org/{{ sws_page.content | regex_search('href="(download/featured/sws-[^"]*-Linux-x86_64\.tar\.xz)"', '\1') | first }}
        dest: "{{ sws_tmp.path }}/sws.tar.xz"
        mode: "0644"
      when: sws_tmp.path is defined

    - name: Unpack the SWS tarball
      ansible.builtin.unarchive:
        src: "{{ sws_tmp.path }}/sws.tar.xz"
        dest: "{{ sws_tmp.path }}"
        remote_src: true
      when: sws_tmp.path is defined

    # The tarball is a resource-path overlay (verified layout: UserPlugins/
    # with the .so, Scripts/ with the python bridge, Data/ with grooves) —
    # copy the whole tree over ~/.config/REAPER. rsync without --delete
    # because Data/ is a user-extended pool, not a repo-owned tree.
    - name: Copy the SWS payload into the resource path
      ansible.posix.synchronize:
        src: "{{ sws_tmp.path }}/"
        dest: "{{ lookup('env', 'HOME') }}/.config/REAPER/"
        recursive: true
        rsync_opts:
          - "--exclude=sws.tar.xz"
          - "--checksum"
          - "--omit-dir-times"
      when: sws_tmp.path is defined

  always:
    - name: Remove the SWS temp dir
      ansible.builtin.file:
        path: "{{ sws_tmp.path }}"
        state: absent
      when: sws_tmp.path is defined

- name: Probe for ReaPack
  ansible.builtin.stat:
    path: "{{ lookup('env', 'HOME') }}/.config/REAPER/UserPlugins/reaper_reapack-x86_64.so"
  register: reapack_plugin
  check_mode: false

# Single .so straight from the project's stable latest-release URL; no
# tarball, no scrape. GitHub's /releases/latest/download/ redirects to the
# current version.
- name: Install ReaPack
  ansible.builtin.get_url:
    url: https://github.com/cfillion/reapack/releases/latest/download/reaper_reapack-x86_64.so
    dest: "{{ lookup('env', 'HOME') }}/.config/REAPER/UserPlugins/reaper_reapack-x86_64.so"
    mode: "0644"
  when: not reapack_plugin.stat.exists

# --- Reapertips removal -----------------------------------------------------
# This role used to install the Reapertips theme, its two icon packs, its
# colour palette, its attribution file and the Fira Sans fonts it called for.
# These tasks stay PERMANENTLY (the claude_desktop state: absent precedent):
# a machine that ran the old revision still has all of it on disk, and nothing
# else would ever clean it up. On a machine that never did, every task here is
# a no-op — the loops are empty and print nothing.
#
# Both icon prefixes matter: RT_ (2265 files) AND RTH_ (257 files). The old
# CLAUDE.md only ever mentioned RT_, which would have stranded the HiDPI half.
# The find is scoped to those prefixes precisely so REAPER's own 1529
# toolbar_*.png files are never touched.

- name: Find the Reapertips toolbar icons left on disk
  ansible.builtin.find:
    paths: "{{ lookup('env', 'HOME') }}/.config/REAPER/Data/toolbar_icons"
    patterns:
      - RT_*
      - RTH_*
    recurse: true
    file_type: file
  register: reapertips_icons
  check_mode: false

- name: Remove the Reapertips toolbar icons
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop: "{{ reapertips_icons.files | map(attribute='path') | list }}"
  loop_control:
    label: "{{ item | basename }}"

# The track icons came as 12 whole category dirs, all RT_-prefixed inside.
# Listed explicitly rather than swept: a file-only sweep would leave 12 empty
# directories behind, and an unscoped directory sweep could over-reach.
- name: Remove the Reapertips track-icon categories
  ansible.builtin.file:
    path: "{{ lookup('env', 'HOME') }}/.config/REAPER/Data/track_icons/{{ item }}"
    state: absent
  loop: [Bass, Brass, Drums, FX, Guitar, Keys, Misc, Perc, Strings, Utility, Wind, Woodwind]

- name: Remove the remaining Reapertips and font assets
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop:
    - "{{ lookup('env', 'HOME') }}/.config/REAPER/ColorThemes/Reapertips Theme.ReaperThemeZip"
    - "{{ lookup('env', 'HOME') }}/.config/REAPER/Data/ReapertipsTheme_ColorPalette.txt"
    - "{{ lookup('env', 'HOME') }}/.config/REAPER/Data/reapertips-license.txt"
    # Fira Sans was bundled only because the Reapertips guide asked for it;
    # LCS_Flat-7 names no font this system lacks, so nothing replaces them.
    - "{{ lookup('env', 'HOME') }}/.local/share/fonts/FiraSans-Regular.ttf"
    - "{{ lookup('env', 'HOME') }}/.local/share/fonts/FiraSans-Bold.ttf"
  loop_control:
    label: "{{ item | basename }}"

# --- first-run settings -----------------------------------------------------
# reaper.ini is rewritten by REAPER on every exit — managing it converged
# would fight the app the same way claude_desktop_config.json would (the
# rewrite-at-runtime trap), so the role SEEDS it only when absent: on a
# fresh machine REAPER's first run adopts these values and fills in its own
# defaults for everything else; after that the file belongs to REAPER.
# Every key in the template was verified against mespotine's config-var
# documentation (github.com/mespotine/ultraschall-and-reaper-docs) — settings
# whose keys could NOT be verified are deliberately left to the manual nudge
# below rather than guessed.

- name: Probe for an existing reaper.ini
  ansible.builtin.stat:
    path: "{{ lookup('env', 'HOME') }}/.config/REAPER/reaper.ini"
  register: reaper_ini
  check_mode: false

# The seed points auto-save backups and the peak cache at dedicated dirs —
# they must exist before REAPER first tries to write into them.
- name: Ensure the backup and peak-cache dirs exist
  ansible.builtin.file:
    path: "{{ lookup('env', 'HOME') }}/Music/REAPER/{{ item }}"
    state: directory
    mode: "0755"
  loop:
    - Backups
    - Peaks

- name: Seed reaper.ini with the Ableton-shaped defaults (first run only)
  ansible.builtin.template:
    src: reaper.ini.j2
    dest: "{{ lookup('env', 'HOME') }}/.config/REAPER/reaper.ini"
    mode: "0644"
  when: not reaper_ini.stat.exists
  register: reaper_seeded

# --- migrating an already-configured machine --------------------------------
# The seed above fires only when reaper.ini is ABSENT, so on a machine that
# has already run REAPER a new template changes nothing. The two things worth
# carrying across anyway get additive-probe treatment (the Nautilus bookmark
# rule): applied only when REAPER has no opinion of its own, so a later
# in-app change always wins and this can never flip-flop.
#
# Caveat shared by every reaper.ini and reaper-kb.ini task below: REAPER must
# not be RUNNING. It dumps its in-memory config at exit and would drop a line
# added underneath it. That is self-healing — the next run re-adds it.

- name: Probe reaper.ini for a retired theme selection
  ansible.builtin.command:
    argv:
      - grep
      - -Eq
      - ^lastthemefn5=.*ColorThemes/(Reapertips Theme|rLive|part_)
      - "{{ lookup('env', 'HOME') }}/.config/REAPER/reaper.ini"
  register: reaper_old_theme
  failed_when: false
  changed_when: false
  check_mode: false
  when: reaper_ini.stat.exists

# Gated on finding the OLD value, so it fires exactly once per machine and
# can never override a theme aaron picks in-app later. Deleting reaper.ini to
# force a reseed was rejected: it would also destroy REAPER's audio-device
# config, window positions and MIDI hardware state.
- name: Repoint the theme selection at the current theme (one-time migration)
  ansible.builtin.lineinfile:
    path: "{{ lookup('env', 'HOME') }}/.config/REAPER/reaper.ini"
    regexp: ^lastthemefn5=
    line: lastthemefn5={{ lookup('env', 'HOME') }}/.config/REAPER/ColorThemes/{{ reaper_theme_file }}
    mode: "0644"
  when:
    - reaper_ini.stat.exists
    - reaper_old_theme.rc is defined
    - reaper_old_theme.rc == 0

# zoommode/vzoommode are the two keys that actually deliver Ableton's zoom
# feel, and REAPER only writes them once they are changed from default — so
# "absent" reliably means "aaron has never expressed an opinion", and adding
# them then is safe. Once present (by us or by his own Preferences change) the
# probe skips forever.
- name: Probe reaper.ini for an existing zoom-center preference
  ansible.builtin.command:
    argv:
      - grep
      - -Eq
      - ^(v)?zoommode=
      - "{{ lookup('env', 'HOME') }}/.config/REAPER/reaper.ini"
  register: reaper_zoommode
  failed_when: false
  changed_when: false
  check_mode: false
  when: reaper_ini.stat.exists

- name: Add the Ableton zoom-center preferences to an existing reaper.ini
  ansible.builtin.lineinfile:
    path: "{{ lookup('env', 'HOME') }}/.config/REAPER/reaper.ini"
    line: "{{ item }}"
    insertafter: ^\[REAPER\]
    mode: "0644"
  # 0 = zoom around the edit/play cursor, matching Live's selection-anchored
  # horizontal zoom; 3 = vertical zoom on the track under the mouse, which is
  # what Live's Option+scroll does. See the template for the full reasoning.
  loop:
    - zoommode=0
    - vzoommode=3
  when:
    - reaper_ini.stat.exists
    - reaper_zoommode.rc is defined
    - reaper_zoommode.rc != 0

# --- Ableton-shaped wheel navigation ----------------------------------------
# Two-finger scroll arrives as REAPER's wheel input, which is NOT a
# mouse-modifier context — verified against the 7.78 binary, whose only wheel
# contexts are MM_CTX_{TCP,MCP}_MOUSE{,H}WHEEL and the fader ones. Arrange
# wheel behaviour can therefore ONLY be expressed as reaper-kb.ini keyboard
# bindings: `KEY <mod> <key> <cmd> <section>`, where mod is always 255 for
# wheel input and the KEY field encodes both axis and modifier —
# vertical 248 bare / 249 Ctrl / 250 Alt / 252 Shift, horizontal 216 bare.
# (88 is a legacy alias for the horizontal wheel — don't use it.)
#
# Direction: SWELL sends +120 for both GDK_SCROLL_UP and GDK_SCROLL_LEFT.
# +120 for UP matches the Windows convention REAPER expects, so vertical
# actions need no reversal; +120 for LEFT is inverted (Windows sends positive
# for RIGHT), which is why the horizontal binding uses the *reversed* action
# 977 rather than 988. That is a SWELL bug being compensated, not a GNOME
# natural-scroll setting — changing GNOME's scroll direction will not undo it.
#
# Ableton parity, with Cmd -> Ctrl (macOS bit 2 is Command; on Linux it's
# Ctrl — never Super, which mutter owns):
#   bare scroll        -> scroll tracks vertically      (Live: same)
#   Shift + scroll     -> scroll the timeline           (Live: same)
#   Ctrl  + scroll     -> zoom time                     (Live: Cmd+scroll)
#   Alt   + scroll     -> track height                  (Live: Option+scroll)
# Live's pinch-to-zoom has no substitute: SWELL's SWELL_GetGestureInfo() is an
# unconditional `return FALSE` and it never posts WM_GESTURE, so the gesture
# reaches the process and is discarded. Ctrl+scroll IS the pinch replacement.
#
# reaper-kb.ini is rewritten by REAPER whenever shortcuts change in-app, but
# unlike reaper.ini the written state PRESERVES these lines once adopted — so
# this is the additive-probe class: add a binding only when NO binding exists
# for that (modifier, key, section) triple. Any command id counts, so an
# in-app rebinding always wins.
#
# The probe is awk, not grep, because REAPER writes key values >=256 that are
# congruent mod 256 (a real `KEY 255 6396 989 0` has been seen in the wild;
# 6396 % 256 == 252). A literal grep would miss those and re-add a duplicate.

- name: Probe for existing wheel bindings
  ansible.builtin.command:
    argv:
      - awk
      - -v
      - key={{ item.key }}
      - -v
      - sect={{ item.section }}
      - $1=="KEY" && $2==255 && ($3%256)==key && $NF==sect {found=1} END{exit !found}
      - "{{ lookup('env', 'HOME') }}/.config/REAPER/reaper-kb.ini"
  register: reaper_wheel
  failed_when: false
  changed_when: false
  check_mode: false
  loop:
    - {key: 248, section: 0, cmd: 989, what: "scroll vertically"}
    - {key: 252, section: 0, cmd: 988, what: "Shift: scroll horizontally"}
    - {key: 249, section: 0, cmd: 990, what: "Ctrl: zoom horizontally"}
    - {key: 250, section: 0, cmd: 972, what: "Alt: adjust track heights"}
    - {key: 216, section: 0, cmd: 977, what: "horizontal wheel, reversed"}
    - {key: 248, section: 32060, cmd: 40432, what: "MIDI: scroll vertically"}
    - {key: 249, section: 32060, cmd: 40431, what: "MIDI: zoom horizontally"}
    - {key: 216, section: 32060, cmd: 40660, what: "MIDI: horizontal wheel, reversed"}
  loop_control:
    label: "{{ item.what }}"

- name: Bind the wheel to Ableton-shaped navigation
  ansible.builtin.lineinfile:
    path: "{{ lookup('env', 'HOME') }}/.config/REAPER/reaper-kb.ini"
    line: KEY 255 {{ item.item.key }} {{ item.item.cmd }} {{ item.item.section }}
    create: true
    mode: "0644"
  loop: "{{ reaper_wheel.results }}"
  loop_control:
    label: "{{ item.item.what }}"
  when: item.rc is defined and item.rc != 0

# --- Ableton-shaped drag navigation -----------------------------------------
# Mouse modifiers DO live in a seedable file: ~/.config/REAPER/reaper-mouse.ini,
# as [MM_CTX_*] sections of `mm_<bitmask>=<behaviourID> m` (bitmask +1 shift,
# +2 ctrl, +4 alt, +8 win; mm_8 never exists). Behaviour IDs are per-context
# indices, not a global enum — Preferences > Mouse Modifiers has an "Export
# ReaScript to set these modifiers for this context" button, which is the
# honest way to discover an id rather than guessing one.
#
# Unlike reaper.ini, this file is NOT rewritten when REAPER exits (proven by
# mtime: it predates several REAPER sessions) — only when Mouse Modifiers is
# changed in Preferences. But a seed-if-absent guard would be useless here
# because the file already exists on any machine that has run REAPER, so the
# treatment is additive PER SECTION: a section is written only when it is
# absent entirely, which leaves any in-app customisation untouched.
#
# Ruler drag is Live's headline navigation gesture — horizontal drag scrolls,
# vertical drag zooms, both from one grab on the timeline. That is behaviour
# 10, "Hand scroll and horizontal zoom". It costs the factory "Edit loop
# point", which is moved onto Ctrl+drag (mm_2=1) rather than lost.

- name: Probe reaper-mouse.ini for the drag contexts
  ansible.builtin.command:
    argv:
      - grep
      - -Fq
      - "[{{ item.context }}]"
      - "{{ lookup('env', 'HOME') }}/.config/REAPER/reaper-mouse.ini"
  register: reaper_mouse
  failed_when: false
  changed_when: false
  check_mode: false
  # The section body is carried as a literal block, NOT assembled with a Jinja
  # join: inside a YAML block scalar an escape like '\n' reaches Jinja as two
  # characters and lands in the file verbatim, silently collapsing a section
  # into one broken line (caught by running this from a clean resource path).
  loop:
    - context: MM_CTX_RULER
      what: ruler drag = scroll + zoom (Ctrl keeps loop points)
      body: |-
        [MM_CTX_RULER]
        mm_0=10 m
        mm_2=1 m
    - context: MM_CTX_ARRANGE_MMOUSE
      what: middle-drag = hand scroll
      body: |-
        [MM_CTX_ARRANGE_MMOUSE]
        mm_0=2 m
  loop_control:
    label: "{{ item.context }}"

- name: Add the Ableton-shaped drag contexts
  ansible.builtin.blockinfile:
    path: "{{ lookup('env', 'HOME') }}/.config/REAPER/reaper-mouse.ini"
    marker: "; {mark} {{ item.item.context }} (fedora-init)"
    block: "{{ item.item.body }}"
    create: true
    mode: "0644"
  loop: "{{ reaper_mouse.results }}"
  loop_control:
    label: "{{ item.item.what }}"
  when: item.rc is defined and item.rc != 0

# What Ableton does that this role deliberately does NOT try to encode:
# settings whose ini keys aren't verifiable, behaviours with no REAPER
# equivalent, and anything needing an interactive flow. Printed once, on the
# run that seeded the config — the tailscale-up pattern.
- name: Remaining manual setup (not automatable)
  ansible.builtin.debug:
    msg:
      - "REAPER installed with the LCS_Flat-7 theme preselected. Manual steps remaining:"
      - "1. Run `reaper` once — evaluation/license notice, then the theme loads."
      - "2. Extensions > ReaPack > Synchronize packages (installs the default repos)."
      - "3. Track colours are muted in the panels already (Custom Color Strength ships at 45 of 100)."
      - "   To retune it, or anything else in the theme's 295 parameters, run REAPER's own adjuster:"
      - "   Actions > Show action list > 'Script: Default_7.0_theme_adjuster.lua' (LCS_Flat-7 is"
      - "   Default-7.0-derived, so the stock adjuster drives it — nothing extra to install)."
      - "   Arrange ITEMS still take the raw track colour; if those read too bright, turn down"
      - "   Preferences > Appearance > Media > 'Tint media item peaks/backgrounds' (its ini key is"
      - "   not documented well enough to seed here, so it stays a manual toggle)."
      - "4. Ableton's Option+scroll resizes the track UNDER THE POINTER; the bound stock action (972)"
      - "   resizes SELECTED tracks. For true parity install SWS's 'adjust track height under mouse'"
      - "   action and rebind KEY 255 250 in reaper-kb.ini to it."
      - "5. Live's 'Z' zoom-to-selection and 'X' zoom-back-stack: bind 40031 (zoom to time selection)"
      - "   and SWS's undo-zoom action — the keyboard KEY-line encoding is not documented well enough"
      - "   to seed blind, so set them in Actions > Show action list."
      - "6. Ableton's left-drag on empty arrangement makes a TIME selection, never an object marquee."
      - "   REAPER's equivalent lives in Preferences > Mouse Modifiers > Arrange view/left drag —"
      - "   set it to 'Marquee select time' if you want the Live behaviour."
      - "7. Two things Live does that Linux cannot: pinch-to-zoom (SWELL discards the gesture — use"
      - "   Ctrl+scroll) and smooth/inertial panning (SWELL quantises to 120-unit clicks)."
      - "8. Preferences > Editing Behavior > Mouse: consider 'Ignore mousewheel on all faders'."
  when: reaper_seeded is changed and not ansible_check_mode
