# fedora-init ansible configuration. install.sh runs ansible-playbook from
# the repo root, so this file is picked up from cwd.
[defaults]
inventory = hosts.ini
# Nothing in this workload needs setup facts; package facts are gathered
# explicitly as the play's guard layer (see site.yml).
gathering = explicit
interpreter_python = /usr/bin/python3
# Roles live in-repo, grouped by concern under roles/<group>/<role> (system,
# desktop, dev, ai, audio); the bare roles/ entry is for the shared
# roles/common includes. site.yml names roles without the group — ansible
# searches every entry — and install.sh's substring matcher walks the groups.
roles_path = roles:roles/system:roles/desktop:roles/dev:roles/ai:roles/audio
library = library
display_skipped_hosts = False

